:root {
  color-scheme: dark;
  --bg: #0e1612;
  --surface: #151f1a;
  --surface-2: #1b2721;
  --surface-3: #233229;
  --line: #2a3a31;
  --line-2: #3a4c42;
  --ink: #edf2ed;
  --ink-2: #c2cec6;
  --muted: #92a499;
  --yellow: #f5cf2a;
  --on-yellow: #1c1904;
  --run: #d95926;
  --pass: #3987e5;
  --good: #2fae57;
  --bad: #e0524f;
  --backdrop: rgba(4, 8, 6, .62);
  --shadow: 0 18px 50px rgba(0, 0, 0, .45);
  /* chalkboard elements stay turf-green in both themes */
  --turf: #183424;
  --turf-2: #1e3e2b;
  --turf-line: rgba(233, 241, 230, .2);
  --chalk: #eaf1e6;
  --chalk-2: #b9cbb9;
  --chalk-def: #ffab9c;
  --font-c: 'Barlow Condensed', 'DIN Condensed', 'Arial Narrow', sans-serif;
  --font-t: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif;
  --top-h: 66px;
  --tab-h: 60px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #e9ede7; --surface: #ffffff; --surface-2: #f2f5f0; --surface-3: #e3e9e2; --line: #d3dbd2; --line-2: #b9c5b9;
    --ink: #142019; --ink-2: #33443a; --muted: #5b6c62; --yellow: #f2c200; --on-yellow: #1c1904;
    --run: #eb6834; --pass: #2a78d6; --good: #1f8f43; --bad: #c93a37; --backdrop: rgba(20, 30, 24, .45); --shadow: 0 18px 50px rgba(20, 40, 28, .22);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #e9ede7; --surface: #ffffff; --surface-2: #f2f5f0; --surface-3: #e3e9e2; --line: #d3dbd2; --line-2: #b9c5b9;
  --ink: #142019; --ink-2: #33443a; --muted: #5b6c62; --yellow: #f2c200; --on-yellow: #1c1904;
  --run: #eb6834; --pass: #2a78d6; --good: #1f8f43; --bad: #c93a37; --backdrop: rgba(20, 30, 24, .45); --shadow: 0 18px 50px rgba(20, 40, 28, .22);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overscroll-behavior: none; touch-action: manipulation; }
body { font: 16px/1.45 var(--font-t); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
input, select, textarea { font: inherit; color: var(--ink); }
h1, h2, h3, h4 { margin: 0; font-weight: 600; }
p { margin: 0; }
a { color: var(--pass); }
.num { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ------------------------------------------------------------------ shell */
#app { position: fixed; inset: 0; display: flex; flex-direction: column; padding: var(--sat) var(--sar) 0 var(--sal); }
#top { flex: 0 0 auto; min-height: var(--top-h); display: flex; align-items: center; gap: 14px; padding: 8px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
#view { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; }
#tabs { flex: 0 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); height: calc(var(--tab-h) + var(--sab)); padding-bottom: var(--sab); background: var(--surface); border-top: 1px solid var(--line); }
#tabs button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font: 500 11.5px var(--font-t); }
#tabs button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#tabs button[aria-current="page"] { color: var(--ink); }
#tabs button[aria-current="page"]::before { content: ''; position: absolute; top: -1px; left: 26%; right: 26%; height: 3px; border-radius: 0 0 3px 3px; background: var(--yellow); }
#tabs .dot { position: absolute; top: 9px; right: calc(50% - 20px); width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); }

/* ------------------------------------------------------------------ top bar */
.brand { font: 700 26px/1 var(--font-c); letter-spacing: .01em; }
.brand span { color: var(--yellow); }
.scorebug { display: flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; font-family: var(--font-c); }
.scorebug .tm { display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 9px; }
.scorebug .tm b { font-weight: 700; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 1.1ch; text-align: right; }
.scorebug .ab { font-weight: 600; font-size: 19px; color: var(--ink-2); display: flex; align-items: center; gap: 5px; }
.scorebug .tm.mine .ab::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--yellow); }
.scorebug .tm.poss { background: var(--surface-3); }
.scorebug .tm.poss .ab { color: var(--ink); }
.poss-ball { width: 15px; height: 10px; display: inline-block; }
.scorebug .q { font-weight: 700; font-size: 17px; color: var(--muted); padding: 0 8px; }
.sitbtn { display: flex; align-items: baseline; gap: 10px; padding: 6px 14px; border-radius: 12px; min-height: 48px; text-align: left; }
.sitbtn:active { background: var(--surface-2); }
.sitbtn .dd { font: 700 32px/1 var(--font-c); letter-spacing: .005em; }
.sitbtn .on { font: 600 20px/1 var(--font-c); color: var(--ink-2); }
.sitbtn .edit { font: 500 12px var(--font-t); color: var(--muted); align-self: center; }
.top-spacer { flex: 1; }
.tbtn { min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font: 600 17px var(--font-c); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.tbtn:active { background: var(--surface-3); }
.tbtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tbtn.primary { background: var(--yellow); color: var(--on-yellow); border-color: var(--yellow); }

/* ------------------------------------------------------------------ field strip */
.fieldbar { padding: 10px 16px 0; }
.strip { display: block; width: 100%; height: auto; border-radius: 10px; overflow: hidden; touch-action: manipulation; }
.strip .f { fill: var(--turf); }
.strip .ez { fill: var(--turf-2); }
.strip .rz { fill: rgba(224, 82, 79, .16); }
.strip .yl { stroke: var(--turf-line); stroke-width: 2; }
.strip .yl5 { stroke: var(--turf-line); stroke-width: 1; opacity: .55; }
.strip .yn { fill: var(--chalk-2); font: 600 15px var(--font-c); }
.strip .ezl { fill: var(--chalk); font: 700 17px var(--font-c); letter-spacing: .06em; }
.strip .los { stroke: #7fb4ff; stroke-width: 3; }
.strip .ltg { stroke: var(--yellow); stroke-width: 4; }
.strip .ball { fill: #c8793a; stroke: #f6e2cf; stroke-width: 1.5; }
.strip .arrow { fill: var(--chalk); opacity: .8; }

/* ------------------------------------------------------------------ track */
.track { display: flex; flex-direction: column; min-height: 100%; }
.cols { display: grid; grid-template-columns: 1fr; gap: 14px; padding: 12px 16px 16px; }
.col { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 4px 16px 12px; min-width: 0; }
.col-h { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 0 4px; }
.col-h h2 { font: 700 23px/1.1 var(--font-c); }
.col-h .sub { font-size: 13px; color: var(--muted); }
.grp { padding: 13px 0; border-top: 1px solid var(--line); position: relative; }
.col-h + .grp, .coach + .grp { border-top: 0; }
.grp.focus::before { content: ''; position: absolute; left: -16px; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; background: var(--yellow); }
.grp-h { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; min-height: 26px; }
.grp-h h3 { font: 600 17px/1.2 var(--font-c); color: var(--ink-2); letter-spacing: .01em; }
.grp-h .hint { font-size: 13px; color: var(--muted); }
.grp-h .spacer { flex: 1; }
.info { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line-2); color: var(--muted); font: 700 15px var(--font-c); display: inline-flex; align-items: center; justify-content: center; margin-left: auto; }
.info:active { background: var(--surface-3); }
.repeat { display: block; width: 100%; text-align: left; margin: -2px 0 10px; padding: 9px 12px; border-radius: 10px; border: 1px dashed var(--line-2); color: var(--ink-2); font: 600 16px var(--font-c); }
.repeat:active { background: var(--surface-3); }
.cue { font-size: 13.5px; color: var(--ink-2); margin: -2px 0 10px; padding-left: 10px; border-left: 2px solid var(--yellow); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 46px; min-width: 46px; padding: 0 15px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); font: 600 19px/1 var(--font-c); letter-spacing: .01em; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background .12s, color .12s; }
.chip small { font: 500 12px var(--font-t); color: var(--muted); }
.chip:active { background: var(--surface-3); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.on small { color: inherit; opacity: .75; }
.chip.on.c-run { background: var(--run); border-color: var(--run); color: #fff; }
.chip.on.c-pass, .chip.on.c-sack, .chip.on.c-scramble { background: var(--pass); border-color: var(--pass); color: #fff; }
.chip.wide { flex: 1 1 0; }
.chip.ghost { background: transparent; border-style: dashed; color: var(--ink-2); }
.chips.big .chip { min-height: 56px; font-size: 22px; padding: 0 20px; }
.chips.fill .chip { flex: 1 1 0; }
.chip .k { font: 700 13px var(--font-c); color: var(--muted); margin-left: 2px; }

/* coach's eye: a little chalkboard */
.coach { margin: 6px 0 4px; background: var(--turf); color: var(--chalk); border-radius: 14px; padding: 12px 14px 12px; position: relative; overflow: hidden; }
.coach::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 0% 0%, rgba(255, 255, 255, .05), transparent 60%); }
.coach .focusline { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; }
.coach .focusline .lbl { font: 600 13px var(--font-t); color: var(--chalk-2); }
.coach .focusline .nm { font: 700 21px/1.1 var(--font-c); color: var(--yellow); }
.coach .focusline .chg { margin-left: auto; font: 600 13px var(--font-t); color: var(--chalk-2); border: 1px solid var(--turf-line); padding: 5px 10px; border-radius: 999px; }
.coach .cuetext { font-size: 14.5px; line-height: 1.45; margin-top: 6px; color: var(--chalk); }
.coach .tips { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--turf-line); display: grid; gap: 7px; }
.coach .tip { font-size: 13.5px; line-height: 1.4; color: var(--chalk-2); }
.coach .tip b { color: var(--chalk); font: 700 16px var(--font-c); margin-right: 6px; letter-spacing: .01em; }
.coach .habit { color: var(--chalk); }

/* tendency meter */
.tend { margin-top: 10px; }
.tend .bar { display: flex; height: 12px; gap: 2px; border-radius: 4px; overflow: hidden; background: var(--surface-3); }
.tend .bar i { display: block; height: 100%; }
.tend .bar .r { background: var(--run); border-radius: 4px 0 0 4px; }
.tend .bar .p { background: var(--pass); border-radius: 0 4px 4px 0; }
.tend .row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; font: 600 16px var(--font-c); }
.tend .row .r b, .tend .row .p b { font-size: 19px; }
.tend .ctx { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.legend-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.legend-dot.r { background: var(--run); }
.legend-dot.p { background: var(--pass); }

/* lane picker & landing grid */
.lanes { display: block; width: 100%; height: auto; border-radius: 12px; overflow: hidden; touch-action: manipulation; }
.lanes .bg { fill: var(--turf); }
.lanes .ol { fill: none; stroke: var(--chalk); stroke-width: 2.2; }
.lanes .olc { fill: none; stroke: var(--chalk); stroke-width: 2.2; }
.lanes .lane { fill: rgba(255, 255, 255, .0); cursor: pointer; }
.lanes .lane.on { fill: rgba(217, 89, 38, .55); }
.lanes .lt { fill: var(--chalk-2); font: 600 15px var(--font-c); pointer-events: none; }
.lanes .lane.on + .lt { fill: #fff; }
.lanes .sep { stroke: var(--turf-line); stroke-width: 1; stroke-dasharray: 3 4; }
.lanes .los { stroke: var(--turf-line); stroke-width: 2; }

.lgrid { display: grid; grid-template-columns: 58px repeat(3, 1fr); gap: 0; background: var(--turf); border-radius: 12px; overflow: hidden; color: var(--chalk); }
.lgrid .ch { font: 600 14px var(--font-c); color: var(--chalk-2); text-align: center; padding: 7px 0 4px; }
.lgrid .rh { font: 600 14px/1.05 var(--font-c); color: var(--chalk-2); display: flex; flex-direction: column; justify-content: center; padding-left: 10px; border-top: 1px solid var(--turf-line); }
.lgrid .rh small { font: 500 11px var(--font-t); opacity: .8; }
.lgrid .cell { min-height: 46px; border-top: 1px solid var(--turf-line); border-left: 1px solid var(--turf-line); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--chalk); font: 600 15px var(--font-c); }
.lgrid .cell.los { border-top: 2px solid #7fb4ff; }
.lgrid button.cell:active { background: rgba(255, 255, 255, .07); }
.lgrid .cell.on { background: var(--pass); color: #fff; }
.lgrid .cell b { font: 700 22px/1 var(--font-c); }
.lgrid .cell small { font: 500 11px var(--font-t); color: var(--chalk-2); }

/* yards keypad */
.yards { display: grid; grid-template-columns: minmax(170px, 1fr) 1.25fr; gap: 14px; align-items: stretch; }
.ydisp { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; justify-content: center; }
.ydisp .lbl { font-size: 13px; color: var(--muted); }
.ydisp .v { font: 700 46px/1 var(--font-c); margin: 2px 0 6px; }
.ydisp .v.empty { color: var(--muted); }
.ydisp .nx { font: 600 17px/1.2 var(--font-c); color: var(--ink-2); }
.ydisp .nx b { color: var(--ink); }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.keys button { min-height: 47px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font: 700 24px var(--font-c); }
.keys button:active { background: var(--surface-3); }
.keys button.s { font-size: 17px; color: var(--ink-2); }
.keys .z { grid-column: span 2; }

.flags { display: flex; flex-wrap: wrap; gap: 8px; }
.flag { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px dashed var(--line-2); color: var(--ink-2); font: 600 17px var(--font-c); display: inline-flex; align-items: center; gap: 7px; }
.flag.on { border-style: solid; border-color: var(--yellow); color: var(--ink); background: rgba(245, 207, 42, .1); }
.flag svg { width: 16px; height: 16px; }

.col.post { display: flex; flex-direction: column; padding: 0; }
.col.post .col-scroll { padding: 4px 16px 12px; min-width: 0; }
.logbar { padding: 12px 16px; border-top: 1px solid var(--line); background: var(--surface); border-radius: 0 0 18px 18px; }
.logbtn { width: 100%; min-height: 60px; border-radius: 14px; background: var(--yellow); color: var(--on-yellow); font: 700 24px/1.05 var(--font-c); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; letter-spacing: .01em; }
.logbtn small { font: 600 13px var(--font-t); opacity: .75; }
.logbtn:disabled { background: var(--surface-3); color: var(--muted); cursor: default; }
.morebtn { display: block; width: 100%; margin-top: 12px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); color: var(--ink-2); font: 600 16px var(--font-c); }

.banner { margin: 12px 16px 0; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--yellow); display: flex; align-items: center; gap: 14px; }
.banner p { flex: 1; font-size: 15px; }
.banner p b { font: 700 20px var(--font-c); display: block; }

/* ------------------------------------------------------------------ generic page */
.page { padding: 16px 16px 40px; max-width: 1240px; margin: 0 auto; }
.page-h { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin: 4px 0 14px; }
.page-h h1 { font: 700 34px/1 var(--font-c); }
.page-h .sub { color: var(--muted); font-size: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; min-width: 0; }
.panel + .panel { margin-top: 14px; }
.panel h2 { font: 700 22px/1.1 var(--font-c); margin-bottom: 4px; }
.panel .lede { color: var(--muted); font-size: 13.5px; margin-bottom: 12px; }
.panel h3 { font: 600 17px var(--font-c); color: var(--ink-2); margin: 16px 0 8px; }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
.grid2 > .panel + .panel { margin-top: 0; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.empty h2 { color: var(--ink); font: 700 26px var(--font-c); margin-bottom: 6px; }
.empty p { max-width: 46ch; margin: 0 auto 16px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* segmented controls */
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { min-height: 40px; padding: 0 14px; border-radius: 9px; font: 600 17px var(--font-c); color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.filters { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }

/* stat tiles (one strip, hairline dividers) */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--line); gap: 1px; }
.tile { background: var(--surface); padding: 12px 14px; }
.tile .l { font-size: 12.5px; color: var(--muted); }
.tile .v { font: 700 32px/1.05 var(--font-c); margin-top: 3px; }
.tile .s { font-size: 12.5px; color: var(--ink-2); }

/* tables & bars */
table.t { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.t th { text-align: left; font: 600 14px var(--font-c); color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; font-variant-numeric: tabular-nums; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.lbl { font: 600 17px var(--font-c); white-space: nowrap; }
table.t td.r, table.t th.r { text-align: right; }
table.t td.barcell { width: 42%; min-width: 120px; }
.sbar { display: flex; height: 14px; gap: 2px; }
.sbar i { display: block; height: 100%; min-width: 0; }
.sbar .r { background: var(--run); border-radius: 4px 0 0 4px; }
.sbar .p { background: var(--pass); border-radius: 0 4px 4px 0; }
.sbar .r:last-child { border-radius: 4px; }
.sbar .p:first-child { border-radius: 4px; }
.sbar .u { background: var(--line-2); border-radius: 4px; }
.hbar { height: 12px; border-radius: 0 4px 4px 0; background: var(--ink-2); max-width: 100%; }
.hbar.y { background: var(--yellow); }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink-2); margin: -4px 0 10px; flex-wrap: wrap; }
.sr { display: inline-flex; align-items: center; gap: 5px; }
.sr::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); }
.sr.g::before { background: var(--good); }
.sr.b::before { background: var(--bad); }
.delta { font: 700 15px var(--font-c); padding: 2px 7px; border-radius: 6px; background: var(--surface-3); }
.delta.big { background: var(--yellow); color: var(--on-yellow); }

/* insights */
.ins { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ins li { padding: 10px 12px; border-radius: 12px; background: var(--surface-2); font-size: 15px; line-height: 1.35; }
.ins li .n { color: var(--muted); font-size: 12.5px; }
.ins.watch li { background: transparent; border: 1px solid var(--line-2); border-left: 4px solid var(--yellow); }
.unit-h { display: flex; align-items: center; gap: 8px; margin: 2px 0 10px; }
.unit-h .ab { font: 700 15px var(--font-c); padding: 2px 8px; border-radius: 6px; background: var(--surface-3); }

/* plays list */
.drive { margin-bottom: 16px; }
.drive-h { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-bottom: 2px solid var(--line); flex-wrap: wrap; }
.drive-h .t { font: 700 20px var(--font-c); }
.drive-h .m { color: var(--muted); font-size: 13.5px; }
.drive-h .res { margin-left: auto; font: 700 16px var(--font-c); padding: 3px 10px; border-radius: 8px; background: var(--surface-3); }
.drive-h .res.score { background: var(--yellow); color: var(--on-yellow); }
.drive-h .res.bad { background: rgba(224, 82, 79, .18); color: var(--bad); }
.prow { display: grid; grid-template-columns: 118px 1fr auto; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 11px 6px; border-bottom: 1px solid var(--line); }
.prow:active { background: var(--surface-2); }
.prow .sit { font: 700 18px/1.1 var(--font-c); }
.prow .sit small { display: block; font: 500 12.5px var(--font-t); color: var(--muted); margin-top: 2px; }
.prow .desc { font-size: 14.5px; line-height: 1.35; min-width: 0; }
.prow .desc .pre { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.prow .yd { font: 700 22px var(--font-c); text-align: right; min-width: 64px; }
.prow .yd small { display: block; font: 500 12px var(--font-t); }
.pill { display: inline-block; font: 600 13px var(--font-c); padding: 1px 7px; border-radius: 6px; margin-right: 4px; vertical-align: 1px; }
.pill.run { background: var(--run); color: #fff; }
.pill.pass { background: var(--pass); color: #fff; }
.pill.oth { background: var(--surface-3); }

/* learn */
.learn { display: grid; grid-template-columns: 1fr; gap: 16px; }
.toc { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.toc .grp-name { display: none; }
.toc button { white-space: nowrap; min-height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font: 600 17px var(--font-c); color: var(--ink-2); }
.toc button[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.topic h1 { font: 700 36px/1.05 var(--font-c); margin-bottom: 8px; }
.topic .lead { font-size: 17px; line-height: 1.5; color: var(--ink-2); max-width: 70ch; }
.topic h2 { font: 700 22px var(--font-c); margin: 22px 0 10px; }
.topic ol.steps { list-style: none; padding: 0; margin: 0; counter-reset: s; display: grid; gap: 10px; }
.topic ol.steps li { counter-increment: s; display: grid; grid-template-columns: 38px 1fr; gap: 10px; align-items: start; }
.topic ol.steps li::before { content: counter(s); width: 32px; height: 32px; border-radius: 50%; background: var(--turf); color: var(--yellow); font: 700 19px/32px var(--font-c); text-align: center; }
.topic ol.steps b { font: 700 18px var(--font-c); display: block; }
.topic ol.steps span { color: var(--ink-2); font-size: 15px; }
.topic ul.tells { padding-left: 20px; margin: 0; display: grid; gap: 8px; max-width: 72ch; }
.topic ul.tells li { line-height: 1.45; }
.topic table.t td:nth-child(2) { color: var(--ink-2); }
.topic table.t td:nth-child(3) { color: var(--muted); font-size: 13.5px; }
.figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
figure { margin: 0; }
figure figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; }
.src { font-size: 13px; color: var(--muted); margin-top: 18px; }

/* diagrams (always chalkboard) */
.dg { display: block; width: 100%; height: auto; border-radius: 12px; }
.dg-field { fill: var(--turf); }
.dg-yard { stroke: var(--turf-line); stroke-width: 1; }
.dg-hash { stroke: var(--turf-line); stroke-width: 1.5; }
.dg-los { stroke: #7fb4ff; stroke-width: 2; opacity: .8; }
.dg-zone { stroke-width: 1.5; }
.dg-zone.deep { fill: rgba(57, 135, 229, .22); stroke: rgba(127, 180, 255, .55); }
.dg-zone.under { fill: rgba(245, 207, 42, .12); stroke: rgba(245, 207, 42, .45); }
.dg-zone.gap { fill: none; stroke: rgba(245, 207, 42, .7); stroke-dasharray: 6 6; }
.dg-zlabel { fill: var(--chalk-2); font: 600 15px var(--font-c); }
.dg-boxrect { fill: rgba(255, 171, 156, .1); stroke: var(--chalk-def); stroke-width: 1.5; stroke-dasharray: 7 6; }
.dg-path { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.dg-path.route { stroke: var(--chalk); }
.dg-path.motion { stroke: var(--chalk); stroke-dasharray: 6 6; }
.dg-path.run { stroke: #ff9a5c; stroke-width: 3; }
.dg-path.cut { stroke: #ff9a5c; stroke-dasharray: 5 6; }
.dg-path.pull { stroke: var(--yellow); stroke-width: 3; }
.dg-path.block { stroke: var(--chalk); stroke-width: 2.6; }
.dg-path.rush { stroke: var(--chalk-def); }
.dg-path.def { stroke: var(--chalk-def); stroke-dasharray: 2 0; }
.dg-path.man { stroke: var(--chalk-def); stroke-dasharray: 2 6; stroke-width: 2.2; opacity: .85; }
.dg-head { stroke: none; }
.dg-head.route, .dg-head.motion { fill: var(--chalk); }
.dg-head.run, .dg-head.cut { fill: #ff9a5c; }
.dg-head.pull { fill: var(--yellow); }
.dg-head.rush, .dg-head.def { fill: var(--chalk-def); }
.dg-off { fill: var(--turf); stroke: var(--chalk); stroke-width: 2.2; }
.dg-off.qb { fill: var(--chalk); }
.dg-olabel { fill: var(--chalk); font: 700 12px var(--font-c); }
.dg-olabel.qb { fill: var(--turf); }
.dg-def { fill: var(--chalk-def); font: 700 19px var(--font-c); }
.dg-def.hl { fill: var(--yellow); }
.dg-note { fill: var(--chalk); font: 600 16px var(--font-c); }

/* ------------------------------------------------------------------ sheets */
#sheet-root { position: fixed; inset: 0; z-index: 50; display: none; }
#sheet-root.open { display: block; }
.backdrop { position: absolute; inset: 0; background: var(--backdrop); animation: fade .16s ease-out; }
.sheet { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: min(720px, 100%); max-height: calc(100% - var(--sat) - 30px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0; box-shadow: var(--shadow); animation: rise .2s cubic-bezier(.2, .8, .2, 1); }
.sheet.tall { height: calc(100% - var(--sat) - 30px); }
.sheet-h { display: flex; align-items: center; gap: 12px; padding: 16px 18px 10px; }
.sheet-h h2 { font: 700 26px/1.05 var(--font-c); flex: 1; }
.sheet-b { padding: 4px 18px calc(18px + var(--sab)); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sheet-b .grp:first-child { border-top: 0; }
.sheet .actions { display: flex; gap: 10px; margin-top: 16px; }
.sheet .actions > * { flex: 1; }
.btn { min-height: 52px; border-radius: 12px; padding: 0 18px; background: var(--surface-2); border: 1px solid var(--line); font: 700 20px var(--font-c); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:active { background: var(--surface-3); }
.btn.primary { background: var(--yellow); color: var(--on-yellow); border-color: var(--yellow); }
.btn.danger { color: var(--bad); border-color: rgba(224, 82, 79, .5); }
.btn.sm { min-height: 42px; font-size: 17px; padding: 0 14px; }
.close { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); font: 600 22px var(--font-c); display: inline-flex; align-items: center; justify-content: center; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button { min-width: 52px; min-height: 48px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font: 700 19px var(--font-c); }
.stepper .val { min-width: 120px; text-align: center; font: 700 30px var(--font-c); }
.list-btn { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 4px; border-bottom: 1px solid var(--line); font-size: 16px; }
.list-btn b { font: 700 19px var(--font-c); display: block; }
.list-btn small { color: var(--muted); font-size: 13px; }
.list-btn.on b { color: var(--yellow); }
.field-label { display: block; font: 600 16px var(--font-c); color: var(--ink-2); margin: 14px 0 8px; }
.input { width: 100%; min-height: 48px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface-2); padding: 10px 12px; font-size: 16px; }
textarea.input { min-height: 96px; resize: vertical; }
.teamgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; }
.teamgrid .chip { flex-direction: column; min-height: 58px; gap: 2px; padding: 6px 4px; }
.teamgrid .chip small { font-size: 11px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.toggle-row:last-child { border-bottom: 0; }
.toggle-row .tx b { display: block; font: 600 18px var(--font-c); }
.toggle-row .tx small { color: var(--muted); font-size: 13px; }

/* toast */
#toast-root { position: fixed; left: 0; right: 0; top: calc(var(--sat) + var(--top-h) + 8px); display: flex; justify-content: center; pointer-events: none; z-index: 60; padding: 0 16px; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 14px; max-width: 640px; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 12px 12px 16px; box-shadow: var(--shadow); font-size: 15px; animation: pop .18s ease-out; }
.toast b { font: 700 18px var(--font-c); }
.toast button { min-height: 40px; padding: 0 14px; border-radius: 10px; background: var(--bg); color: var(--ink); font: 700 17px var(--font-c); white-space: nowrap; }
.toast .ok, .toast .no { display: inline-block; margin-left: 6px; padding: 2px 8px; border-radius: 6px; color: #fff; font: 700 15px var(--font-c); letter-spacing: .01em; }
.toast .ok { background: var(--good); }
.toast .no { background: var(--bad); }
@keyframes rise { from { transform: translate(-50%, 24px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
@keyframes pop { from { transform: translateY(-12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.noanim { animation: none !important; }
#view.noscroll { overflow: hidden; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* ------------------------------------------------------------------ responsive */
@media (min-width: 700px) {
  .grid2 { grid-template-columns: 1fr 1fr; }
  .learn { grid-template-columns: 230px 1fr; align-items: start; }
  .toc { flex-direction: column; overflow: visible; position: sticky; top: 12px; }
  .toc .grp-name { display: block; font: 600 14px var(--font-c); color: var(--muted); margin: 10px 4px 2px; }
  .toc button { text-align: left; border: 0; background: transparent; }
}
@media (min-width: 1000px) {
  .track.two { height: 100%; min-height: 0; }
  .track.two .cols { flex: 1; min-height: 0; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); }
  .track.two .col.pre, .track.two .col-scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .track.two .col.post { overflow: hidden; }
  .track.two .col-scroll { flex: 1; min-height: 0; }
  .grid3 { grid-template-columns: 1fr 1fr 1fr; }
}
@media (max-width: 999px) {
  .track { padding-bottom: 92px; }
  .track .logbar { position: fixed; left: 0; right: 0; bottom: calc(var(--tab-h) + var(--sab)); z-index: 6; border-radius: 0; background: var(--bg); padding: 10px calc(16px + var(--sar)) 10px calc(16px + var(--sal)); }
  .track .logbtn { min-height: 56px; }
  .sitbtn .dd { font-size: 28px; }
}
@media (max-width: 760px) {
  #top { gap: 8px; padding: 8px 10px; flex-wrap: wrap; }
  .scorebug .tm b { font-size: 22px; }
  .sitbtn .dd { font-size: 25px; }
  .tbtn .lbl { display: none; }
  .yards { grid-template-columns: 1fr; }
  .prow { grid-template-columns: 92px 1fr auto; gap: 10px; }
  #tabs button { font-size: 10.5px; }
}
@media (min-width: 1000px) and (max-height: 860px) {
  .track.two .col-h { display: none; }
  .track.two .col.pre { padding-top: 10px; }
  .track.two .col-scroll { padding-top: 10px; }
  .coach .cuetext { font-size: 13.5px; }
  .coach .tips { margin-top: 8px; padding-top: 8px; }
  .fieldbar { padding-top: 8px; }
}
