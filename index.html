  function draftFor(target) { return target === 'edit' ? UI.editDraft : cur().draft; }

  function openSheet(name, data) {
    if (UI.sheet) UI.stack.push(UI.sheet);
    UI.sheet = { name, data: data || {} };
    UI.sheetDrawn = null;
    renderSheet();
  }
  function closeSheet() {
    UI.sheet = UI.stack.pop() || null;
    UI.sheetDrawn = null;
    UI.confirm = null;
    renderAll();
  }
  function closeAll() { UI.stack = []; UI.sheet = null; UI.sheetDrawn = null; UI.confirm = null; }
  function renderSheet() {
    const root = $('#sheet-root');
    if (!UI.sheet) { root.className = ''; root.innerHTML = ''; return; }
    const fn = SHEETS[UI.sheet.name];
    if (!fn) { UI.sheet = null; return renderSheet(); }
    const r = fn(UI.sheet.data);
    const same = UI.sheetDrawn === UI.sheet.name;
    const oldBody = root.querySelector('.sheet-b');
    const keep = same && oldBody ? oldBody.scrollTop : 0;
    const draftAttr = r.draft ? ` data-draft="${r.draft}"` : (UI.sheet.data.target ? ` data-draft="${UI.sheet.data.target}"` : '');
    root.className = 'open';
    root.innerHTML = `<div class="backdrop${same ? ' noanim' : ''}" data-act="close"></div><div class="sheet${r.tall ? ' tall' : ''}${same ? ' noanim' : ''}" role="dialog" aria-modal="true" aria-label="${esc(r.title)}"><div class="sheet-h"><h2>${esc(r.title)}</h2><button class="close" data-act="close" aria-label="Close">×</button></div><div class="sheet-b"${draftAttr}>${r.body}</div></div>`;
    const nb = root.querySelector('.sheet-b');
    if (nb && keep) nb.scrollTop = keep;
    UI.sheetDrawn = UI.sheet.name;
  }

  // ================================================================ render all
  function renderView() {
    const v = $('#view');
    const keep = {};
    v.querySelectorAll('[data-keep]').forEach(el => { keep[el.dataset.keep] = el.scrollTop; });
    const sameTab = UI.lastTab === UI.tab;
    const top = sameTab ? v.scrollTop : 0;
    const fn = { track: viewTrack, plays: viewPlays, stats: viewStats, report: viewReport, learn: viewLearn, season: viewSeason }[UI.tab];
    v.innerHTML = fn();
    v.classList.toggle('noscroll', UI.tab === 'track' && window.matchMedia('(min-width: 1000px)').matches);
    if (sameTab) v.querySelectorAll('[data-keep]').forEach(el => { if (keep[el.dataset.keep] != null) el.scrollTop = keep[el.dataset.keep]; });
    v.scrollTop = top;
    UI.lastTab = UI.tab;
  }
  function applyTheme() {
    const t = DB.settings.theme;
    if (t === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    const dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', dark ? '#0e1612' : '#e9ede7');
  }
  function renderAll() { applyTheme(); renderTop(); renderView(); renderTabs(); renderSheet(); syncWake(); }

  // ================================================================ toast
  let toastTimer = null;
  function toast(html, o) {
    o = o || {};
    const root = $('#toast-root');
    const btn = o.undo ? '<button data-act="undo">Undo</button>' : o.action ? `<button data-act="${o.action[1]}">${esc(o.action[0])}</button>` : '';
    root.innerHTML = `<div class="toast" role="status"><span>${html}</span>${btn}</div>`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { root.innerHTML = ''; }, o.ms || 4000);
  }

  // ================================================================ wake lock
  let wakeLock = null;
  async function syncWake() {
    const g = cur();
    const want = DB.settings.wake && UI.tab === 'track' && g && g.status !== 'final' && !document.hidden;
    try {
      if (want && !wakeLock && navigator.wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } else if (!want && wakeLock) { const w = wakeLock; wakeLock = null; await w.release(); }
    } catch (e) { wakeLock = null; }
  }

  // ================================================================ actions
  function doLog(fields) {
    const g = cur();
    const p = SR.logPlay(g, fields);
    g.draft = {};
    save();
    let msg = `<b>${esc(playLine(p))}</b>`;
    if (p.pred && SR.isSnap(p)) {
      const hit = (p.pred === 'pass') === SR.isDropback(p);
      msg += hit ? ' <span class="ok">✓ you called it</span>' : ` <span class="no">✗ you said ${p.pred}</span>`;
    }
    toast(msg, { undo: true });
    closeAll();
    if (g.sit.pending) openSheet(g.sit.pending.kind === 'pat' ? 'pat' : 'drive');
    renderAll();
    const v = $('#view');
    v.scrollTop = 0;
    v.querySelectorAll('[data-keep]').forEach(el => { el.scrollTop = 0; });
  }
  function undo() {
    const g = cur();
    if (!g || !g.plays.length) return;
    const p = SR.undoLast(g);
    g.draft = draftFromPlay(p);
    if (g.status === 'final') g.status = 'live';
    save();
    closeAll();
    toast('Snap removed. It’s back in the form if you want to fix and re-log it.');
    renderAll();
  }
  function stripSpot(el, ev) {
    const svg = el.closest('svg');
    const r = svg.getBoundingClientRect();
    const x = ((ev.clientX - r.left) / r.width) * 1200;
    return SR.clamp(Math.round((x - 100) / 10), 1, 99);
  }
  function exportFile(name, text, type) {
    const blob = new Blob([text], { type });
    const file = typeof File === 'function' ? new File([blob], name, { type }) : null;
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).catch(() => {});
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }
  function importData(text) {
    let d;
    try { d = JSON.parse(text); } catch (e) { toast('That file isn’t a Snap Read backup (couldn’t read it as JSON).'); return; }
    if (!d || !Array.isArray(d.games)) { toast('That file isn’t a Snap Read backup (no games in it).'); return; }
    let added = 0, updated = 0;
    for (const gi of d.games) {
      if (!gi || !gi.id || !Array.isArray(gi.plays)) continue;
      const i = DB.games.findIndex(g => g.id === gi.id);
      if (i < 0) { DB.games.push(gi); added++; }
      else if ((gi.updated || 0) > (DB.games[i].updated || 0)) { DB.games[i] = gi; updated++; }
    }
    if (!DB.settings.my && d.settings && d.settings.my) DB.settings.my = d.settings.my;
    if (!DB.current && DB.games.length) DB.current = DB.games[DB.games.length - 1].id;
    version++; persist();
    toast(`Restored: ${added} new game${added === 1 ? '' : 's'}, ${updated} updated.`);
    renderAll();
  }

  function handle(act, el, ev) {
    const g = cur();
    const v = el.dataset.v, k = el.dataset.k;
    const scope = el.closest('[data-draft]');
    const target = scope ? scope.dataset.draft : 'live';
    switch (act) {
      case 'tab': UI.tab = v; closeAll(); UI.more = UI.more && v === 'track'; renderAll(); return;
      case 'more': UI.more = !UI.more; renderView(); return;
      case 'set': {
        const d = draftFor(target);
        if (el.dataset.multi) { const arr = d[k] || []; d[k] = arr.includes(v) ? arr.filter(x => x !== v) : arr.concat(v); }
        else d[k] = d[k] === v ? null : v;
        if (k === 'cov' && d.cov) d.covf = SR.COV_FAMILY[d.cov];
        if (k === 'covf' && d.cov && SR.COV_FAMILY[d.cov] !== d.covf) d.cov = null;
        if (k === 'pr' && d.pr !== 'comp') { d.yds = ''; d.fum = false; }
        if (k === 'motion' && (!d.motion || d.motion === 'none')) d.mread = null;
        if (k === 'type') { if (d.type !== 'pass') d.pr = null; if (d.type === 'sack') d.rtd = false; }
        if (target === 'live') save();
        renderAll();
        return;
      }
      case 'cell': {
        const d = draftFor(target);
        const dv = v.slice(0, 2), dir = v.slice(2);
        if (d.depth === dv && d.dir === dir) { d.depth = null; d.dir = null; } else { d.depth = dv; d.dir = dir; }
        if (target === 'live') save();
        renderAll();
        return;
      }
      case 'key': {
        const d = draftFor(target);
        const s = target === 'edit' ? d._sit : g.sit;
        let y = d.yds == null ? '' : String(d.yds);
        if (v === 'del') y = y.slice(0, -1);
        else if (v === 'neg') y = y.startsWith('-') ? y.slice(1) : '-' + y;
        else if (v === 'first') y = String(Math.min(s.dist, 100 - s.spot));
        else if (v === 'td') y = String(100 - s.spot);
        else {
          const digits = y.replace('-', '');
          if (digits === '0') y = y.replace('0', '');
          if (y.replace('-', '').length < 2) y += v;
        }
        d.yds = y;
        if (target === 'live') save();
        renderAll();
        return;
      }
      case 'toggle': { const d = draftFor(target); d[k] = !d[k]; if (k === 'fum' && !d.fum) d.rtd = false; if (target === 'live') save(); renderAll(); return; }
      case 'log': { const d = g.draft; if (!canLog(g, d).ok) return; doLog(playFromDraft(d)); return; }
      case 'undo': undo(); return;
      case 'repeat': {
        const last = g.plays.find(x => x.id === v);
        if (!last) return;
        for (const f of ['pers', 'qb', 'set']) if (last[f]) g.draft[f] = last[f];
        save(); renderAll(); return;
      }
      case 'sheet': {
        if (v === 'myteam') { openSheet('myteam'); return; }
        if (!g && v !== 'myteam') return;
        openSheet(v, (v === 'penalty' || v === 'notes') ? { target } : {});
        if (v === 'penalty') { const d = draftFor(target); if (!d.pen) d.pen = { on: null, yds: 5, noPlay: true }; renderSheet(); }
        return;
      }
      case 'close': closeSheet(); return;
      case 'pending': if (g && g.sit.pending) openSheet(g.sit.pending.kind === 'pat' ? 'pat' : 'drive'); return;
      case 'learn': openSheet('learn', { topic: v }); return;
      case 'topic': UI.learn = v; renderView(); $('#view').scrollTop = 0; return;
      case 'focus': g.focus = v; save(); closeSheet(); return;
      case 'sit': {
        const s = g.sit;
        if (k === 'off') {
          if (s.off !== v) {
            const phys = s.off ? 100 - s.spot : s.spot;
            s.off = v; s.spot = SR.clamp(phys, 1, 99); s.drive = maxDrive(g) + 1; s.down = 1; s.dist = Math.min(10, 100 - s.spot); s.pending = null;
          }
        } else if (k === 'q') { SR.setQuarter(g, +v); }
        else if (k === 'down') s.down = +v;
        else if (k === 'dist') s.dist = SR.clamp(s.dist + +v, 1, 100 - s.spot);
        else if (k === 'distset') s.dist = SR.clamp(+v, 1, 100 - s.spot);
        else if (k === 'goal') s.dist = 100 - s.spot;
        else if (k === 'spot') { s.spot = SR.clamp(s.spot + +v, 1, 99); if (s.spot + s.dist > 100) s.dist = 100 - s.spot; }
        save(); renderAll(); return;
      }
      case 'adj': g.adj[el.dataset.side] = (g.adj[el.dataset.side] || 0) + +v; save(); renderAll(); return;
      case 'strip': {
        const y = stripSpot(el, ev);
        if (k === 'sit') { g.sit.spot = y; if (g.sit.spot + g.sit.dist > 100) g.sit.dist = 100 - g.sit.spot; save(); }
        else if (k === 'drive') UI.sheet.data.spot = y;
        renderAll(); return;
      }
      case 'dside': UI.sheet.data.side = v; renderSheet(); return;
      case 'dspot': UI.sheet.data.spot = +v; renderSheet(); return;
      case 'dstep': UI.sheet.data.spot = SR.clamp(UI.sheet.data.spot + +v, 1, 99); renderSheet(); return;
      case 'dstart': {
        const dt = UI.sheet.data, p = g.sit.pending || {};
        if (!dt.side) return;
        if (p.reason === 'kickoff' || p.reason === 'half' || !p.reason) g.lastKick = dt.spot;
        SR.startDrive(g, dt.side, dt.spot);
        save(); closeAll(); UI.tab = 'track'; renderAll(); return;
      }
      case 'pat': {
        const p = g.sit.pending;
        const play = g.plays.find(x => x.id === p.playId);
        if (play) play.pat = v;
        g.sit.pending = { kind: 'drive', side: SR.other(p.side), reason: 'kickoff' };
        save(); closeAll(); openSheet('drive'); renderAll(); return;
      }
      case 'spec': {
        const d = g.draft;
        if (v === 'nop') { d.type = 'nop'; if (!d.pen) d.pen = { on: null, yds: 5, noPlay: true }; save(); UI.stack = []; UI.sheet = { name: 'penalty', data: { target: 'live' } }; UI.sheetDrawn = null; renderAll(); return; }
        if (!g.sit.off || g.sit.pending) { toast('Start the drive first.'); return; }
        const pre = playFromDraft(Object.assign({}, d, { type: null }));
        delete pre.type; delete pre.yds;
        const f = Object.assign(pre, { type: v === 'fg1' || v === 'fg0' ? 'fg' : v });
        if (v === 'fg1') f.fgGood = true;
        if (v === 'kneel') f.yds = -1;
        delete f.rush; delete f.covf; delete f.cov; delete f.rushx;
        doLog(f); return;
      }
      case 'pen': {
        const d = draftFor(UI.sheet && UI.sheet.data.target);
        const pen = d.pen || (d.pen = { on: null, yds: 5, noPlay: true });
        if (k === 'remove') { d.pen = null; if (d.type === 'nop') d.type = null; save(); closeSheet(); return; }
        if (k === 'on') pen.on = v;
        else if (k === 'yds') pen.yds = +v;
        else if (k === 'ystep') pen.yds = SR.clamp((pen.yds || 0) + +v, 1, 99);
        else if (k === 'noPlay') pen.noPlay = v === '1';
        else if (k === 'auto1st') pen.auto1st = v === '1';
        else if (k === 'lossDown') pen.lossDown = v === '1';
        if (pen.on === 'off') pen.auto1st = false;
        if (pen.on === 'def') pen.lossDown = false;
        save(); renderAll(); return;
      }
      case 'menu': {
        if (v === 'halftime') { SR.setQuarter(g, 3); save(); closeAll(); UI.tab = 'report'; UI.report = 'half'; toast('Halftime. Here’s your report. Start the 2nd half from the Track tab.'); renderAll(); return; }
        if (v === 'nextq') { SR.setQuarter(g, Math.min(g.sit.q + 1, 5)); save(); closeAll(); renderAll(); return; }
        if (v === 'endgame') { g.status = 'final'; save(); closeAll(); UI.tab = 'report'; UI.report = 'full'; renderAll(); toast('Game final. Save a backup to Files while you think of it.', { action: ['Back up', 'export'], ms: 8000 }); return; }
        if (v === 'reopen') { g.status = 'live'; save(); closeAll(); renderAll(); return; }
        if (v.startsWith('sheet:')) { closeAll(); openSheet(v.slice(6)); renderAll(); return; }
        if (v.startsWith('tab:')) { closeAll(); UI.tab = v.slice(4); renderAll(); return; }
        return;
      }
      case 'reopen': g.status = 'live'; save(); renderAll(); return;
      case 'newgame': if (!DB.settings.my) { openSheet('myteam', { thenNew: true }); return; } openSheet('newgame'); return;
      case 'pickmy': {
        DB.settings.my = v; save();
        const thenNew = UI.sheet && UI.sheet.data.thenNew;
        closeAll();
        if (thenNew || !DB.games.length) openSheet('newgame');
        renderAll(); return;
      }
      case 'ng': {
        const dt = UI.sheet.data;
        if (k === 'mode') dt.mode = v;
        else if (k === 'myHome') dt.myHome = v === '1';
        else dt[k] = dt[k] === v ? null : v;
        renderSheet(); return;
      }
      case 'ngstart': {
        const dt = UI.sheet.data, my = DB.settings.my;
        let home, away, mine = null;
        if (dt.mode === 'mine') { home = dt.myHome ? my : dt.opp; away = dt.myHome ? dt.opp : my; mine = my; }
        else { home = dt.home; away = dt.away; mine = (home === my || away === my) ? my : null; }
        if (!home || !away) return;
        const ng = SR.newGame({ home, away, my: mine, week: dt.week, date: dt.date });
        DB.games.push(ng); DB.current = ng.id; save();
        closeAll(); UI.tab = 'track'; UI.report = null; UI.stats.scope = 'game'; UI.stats.unit = 'myoff';
        openSheet('drive'); renderAll(); return;
      }
      case 'swapteams': { const h = g.home; g.home = g.away; g.away = h; for (const p of g.plays) p.off = SR.other(p.off); if (g.sit.off) g.sit.off = SR.other(g.sit.off); if (g.sit.pending && g.sit.pending.side) g.sit.pending.side = SR.other(g.sit.pending.side); const a = g.adj.home; g.adj.home = g.adj.away; g.adj.away = a; save(); renderAll(); return; }
      case 'opengame': DB.current = v; save(); UI.report = null; UI.tab = 'track'; renderAll(); return;
      case 'delgame': {
        if (UI.confirm !== 'del:' + v) { UI.confirm = 'del:' + v; renderView(); return; }
        DB.games = DB.games.filter(x => x.id !== v);
        if (DB.current === v) DB.current = DB.games.length ? DB.games[DB.games.length - 1].id : null;
        UI.confirm = null; save(); renderAll(); return;
      }
      case 'export': {
        persist();
        exportFile(`snapread-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(DB), 'application/json');
        DB.settings.lastBackup = Date.now(); save(); renderAll(); return;
      }
      case 'import': { const inp = $('#importFile'); if (inp) inp.click(); return; }
      case 'csv': exportFile(`snapread-plays-${new Date().toISOString().slice(0, 10)}.csv`, SR.toCSV(DB.games), 'text/csv'); return;
      case 'theme': DB.settings.theme = v; save(); renderAll(); return;
      case 'setopt': DB.settings[k] = v === '1'; save(); renderAll(); return;
      case 'core': { const c = DB.settings.core; DB.settings.core = c.includes(v) ? c.filter(x => x !== v) : c.concat(v); save(); renderAll(); return; }
      case 'sscope': UI.stats.scope = v; renderView(); return;
      case 'sunit': UI.stats.unit = v; renderView(); return;
      case 'speriod': UI.stats.period = v; renderView(); return;
      case 'rmode': UI.report = v; renderView(); return;
      case 'editplay': {
        const p = g.plays.find(x => x.id === v);
        if (!p) return;
        UI.editDraft = Object.assign(draftFromPlay(p), { _id: p.id, _sit: { q: p.q, off: p.off, down: p.down || 1, dist: p.dist, spot: p.spot, drive: p.drive } });
        UI.confirm = null;
        openSheet('edit'); return;
      }
      case 'esit': {
        const s = UI.editDraft._sit;
        if (k === 'off') { if (s.off !== v) { s.off = v; s.spot = SR.clamp(100 - s.spot, 1, 99); } }
        else if (k === 'q') s.q = +v;
        else if (k === 'down') s.down = +v;
        else if (k === 'dist') s.dist = SR.clamp(s.dist + +v, 1, 100 - s.spot);
        else if (k === 'spot') { s.spot = SR.clamp(s.spot + +v, 1, 99); if (s.spot + s.dist > 100) s.dist = 100 - s.spot; }
        renderSheet(); return;
      }
      case 'saveedit': {
        const d = UI.editDraft;
        const c = canLog(Object.assign({}, g, { status: 'live', sit: { off: 'home' } }), d);
        if (!c.ok) { toast(esc(c.why)); return; }
        const idx = g.plays.findIndex(x => x.id === d._id);
        if (idx < 0) return;
        const old = g.plays[idx];
        const np = Object.assign({ id: old.id, t: old.t, drive: old.drive }, { q: d._sit.q, off: d._sit.off, down: d._sit.down, dist: d._sit.dist, spot: d._sit.spot }, SR.cleanFields(playFromDraft(d)));
        if (old.pat) np.pat = old.pat;
        g.plays[idx] = np;
        if (idx === g.plays.length - 1 && g.sit.drive === np.drive && !g.sit.pending) g.sit = SR.nextSituation(g, np);
        save(); closeAll(); toast('Snap updated.');
        if (g.sit.pending) openSheet(g.sit.pending.kind === 'pat' ? 'pat' : 'drive');
        renderAll(); return;
      }
      case 'deledit': {
        if (UI.confirm !== 'delplay') { UI.confirm = 'delplay'; renderSheet(); return; }
        const id = UI.editDraft._id;
        const idx = g.plays.findIndex(x => x.id === id);
        if (idx === g.plays.length - 1) { SR.undoLast(g); }
        else g.plays.splice(idx, 1);
        save(); closeAll(); toast('Snap deleted.'); renderAll(); return;
      }
      default: return;
    }
  }

  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    if (el.tagName === 'BUTTON' || el.getAttribute('role') === 'button' || el.tagName === 'svg' || el.tagName === 'rect') ev.preventDefault();
    try { handle(el.dataset.act, el, ev); }
    catch (e) { console.error(e); toast('Something went wrong: ' + esc(e.message)); }
  });
  document.addEventListener('input', ev => {
    const el = ev.target;
    if (el.dataset && el.dataset.bind) {
      const scope = el.closest('[data-draft]');
      const d = draftFor(scope ? scope.dataset.draft : 'live');
      d[el.dataset.bind] = el.value;
      save();
    }
  });
  document.addEventListener('change', ev => {
    const el = ev.target;
    if (el.id === 'importFile' && el.files && el.files[0]) {
      const r = new FileReader();
      r.onload = () => importData(String(r.result));
      r.readAsText(el.files[0]);
      el.value = '';
      return;
    }
    if (el.dataset && el.dataset.ng && UI.sheet) { UI.sheet.data[el.dataset.ng] = el.value; return; }
    if (el.dataset && el.dataset.gd && UI.sheet) { const g = cur(); UI.sheet.data[el.dataset.gd] = el.value; g[el.dataset.gd] = el.value; save(); renderTop(); }
  });
  document.addEventListener('touchstart', () => {}, { passive: true });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape' && UI.sheet) closeSheet();
  });
  let resizeTimer = null;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(renderView, 120); });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener && window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

  // ================================================================ boot
  if (!DB.current && DB.games.length) DB.current = DB.games[DB.games.length - 1].id;
  if (DB.current && !cur()) DB.current = null;
  const g0 = cur();
  if (g0 && g0.sit.pending && UI.tab === 'track') { /* banner shows it */ }
  renderAll();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  // test hook
  window.__SR_UI = { UI, get DB() { return DB; }, renderAll, handle };
})();

</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
}
</script>
</body>
