<script>
/* Snap Read — UI */
(function () {
  'use strict';
  const SR = window.SR;
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const P = (k, n) => (n ? Math.round((100 * k) / n) + '%' : '—');
  const f1 = v => (Math.round(v * 10) / 10).toFixed(1);
  const sgn = n => (n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '0');

  // ================================================================ storage
  const KEY = 'snapread.v1';
  const DEFAULTS = { my: null, theme: 'auto', wake: true, tips: true, core: ['pred', 'pers', 'qb', 'motion', 'shell', 'rush'], lastBackup: null };
  const CONFIGURABLE = [['pred', 'Your call'], ['pers', 'Personnel'], ['qb', 'QB alignment'], ['set', 'Formation'], ['motion', 'Motion'], ['shell', 'Safeties'], ['box', 'Box count'], ['dpers', 'Def. personnel'], ['rc', 'Run concept'], ['pt', 'Pass type'], ['pres', 'Pocket'], ['rush', 'Rushers'], ['rushx', 'Blitz details'], ['covf', 'Man / zone'], ['cov', 'Coverage']];

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const d = JSON.parse(raw);
        d.settings = Object.assign({}, DEFAULTS, d.settings || {});
        d.games = Array.isArray(d.games) ? d.games : [];
        return d;
      }
    } catch (e) { console.warn('load failed', e); }
    return { settings: Object.assign({}, DEFAULTS), games: [], current: null };
  }
  let DB = load();
  let version = 0, saveTimer = null;
  function persist() {
    clearTimeout(saveTimer); saveTimer = null;
    try { localStorage.setItem(KEY, JSON.stringify(DB)); }
    catch (e) { toast('Couldn’t save: storage is full. Export a backup, then delete old games.'); }
  }
  function save() {
    version++;
    const g = cur(); if (g) g.updated = Date.now();
    clearTimeout(saveTimer); saveTimer = setTimeout(persist, 200);
  }
  const flush = () => { if (saveTimer) persist(); };
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); syncWake(); });

  const cur = () => DB.games.find(g => g.id === DB.current) || null;
  let cache = { v: -1, list: [] };
  function allPlays() {
    if (cache.v !== version) cache = { v: version, list: DB.games.flatMap(SR.enrich) };
    return cache.list;
  }

  // ================================================================ ui state
  const UI = { tab: 'track', lastTab: null, more: false, stack: [], sheet: null, sheetDrawn: null, editDraft: null, confirm: null,
    stats: { scope: 'game', unit: 'myoff', period: 'all' }, report: null, learn: 'routine' };

  // ================================================================ icons
  const ICON = {
    track: '<svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.6 2M9.5 2.5h5M12 2.5V6"/></svg>',
    plays: '<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
    stats: '<svg viewBox="0 0 24 24"><path d="M5 20v-8M11 20V5M17 20v-5M3 20h18"/></svg>',
    report: '<svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.6h6V4M9 10h6M9 14h6M9 18h3"/></svg>',
    learn: '<svg viewBox="0 0 24 24"><path d="M3.5 5.5l4 4M7.5 5.5l-4 4"/><circle cx="18" cy="17" r="3"/><path d="M7 17c4 0 5-6 9.5-8"/><path d="M13.6 8.2l3 .8-.9 3"/></svg>',
    season: '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
    undo: '<svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg>',
    more: '<svg viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3.2"/></svg>',
    flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>'
  };
  const BALL = '<svg class="poss-ball" viewBox="0 0 30 20" aria-label="has the ball"><ellipse cx="15" cy="10" rx="14" ry="8.5" fill="#c8793a"/><path d="M9 10h12M12 8.2v3.6M15 8.2v3.6M18 8.2v3.6" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>';

  // ================================================================ helpers
  function maxDrive(g) { let m = g.sit.drive || 0; for (const p of g.plays) if (p.drive > m) m = p.drive; return m; }
  const depthWord = { dp: 'deep', in: 'intermediate', sh: 'short', bl: 'behind the line' };
  const dirWord = { L: 'left', M: 'middle', R: 'right' };
  const needsYards = d => d.type === 'run' || d.type === 'scramble' || d.type === 'sack' || (d.type === 'pass' && d.pr === 'comp');
  const SCRIM = ['run', 'pass', 'sack', 'scramble'];

  function playLine(p) {
    const o = SR.outcome(p);
    let s;
    switch (p.type) {
      case 'run': s = 'Run' + (p.lane ? ' ' + SR.label('lane', p.lane).toLowerCase() : '') + (p.rc ? ', ' + SR.label('rc', p.rc).toLowerCase() : '') + ' ' + sgn(o.gain); break;
      case 'pass': {
        const where = p.depth && p.dir ? (p.depth === 'bl' ? `behind the line to the ${dirWord[p.dir]}` : `${depthWord[p.depth]} ${dirWord[p.dir]}`) : p.depth ? depthWord[p.depth] : p.dir ? 'to the ' + dirWord[p.dir] : '';
        s = (p.pt ? SR.label('pt', p.pt) : 'Pass') + ' ' + (p.pr === 'comp' ? 'complete' : p.pr === 'int' ? 'intercepted' : 'incomplete') + (where ? ' ' + where : '') + (p.pr === 'comp' ? ' ' + sgn(o.gain) : '');
        break;
      }
      case 'sack': s = 'Sack ' + sgn(o.gain); break;
      case 'scramble': s = 'Scramble ' + sgn(o.gain); break;
      case 'punt': s = 'Punt'; break;
      case 'fg': s = p.fgGood ? 'Field goal good' : 'Field goal missed'; break;
      case 'kneel': s = 'Kneel'; break;
      case 'spike': s = 'Spike'; break;
      case 'nop': s = 'Penalty'; break;
      default: s = p.type || 'Play';
    }
    if (p.pen && p.pen.on) s += `, flag on ${p.pen.on === 'off' ? 'offense' : 'defense'} (${p.pen.yds}${p.pen.noPlay ? ', no play' : ''})`;
    if (o.td) s += ', touchdown';
    if (o.defTD) s += ', returned for a TD';
    if (p.fum) s += ', fumble lost';
    if (o.safety) s += ', safety';
    if (o.turnover === 'downs') s += ', turnover on downs';
    else if (o.fd && !o.td && SCRIM.includes(p.type)) s += ', first down';
    return s;
  }
  function preLine(p) {
    const a = [], b = [];
    if (p.pers) a.push(SR.label('pers', p.pers) + ' personnel');
    if (p.qb) a.push(SR.label('qb', p.qb).toLowerCase());
    if (p.set) a.push(SR.label('set', p.set));
    if (p.motion && p.motion !== 'none') a.push(SR.label('motion', p.motion).toLowerCase() + ' motion' + (p.mread === 'man' ? ' (defender followed)' : p.mread === 'zone' ? ' (defense bumped)' : ''));
    if (p.shell) b.push(SR.label('shell', p.shell));
    if (p.box) b.push(SR.label('box', p.box) + ' in box');
    if (p.rush) b.push(SR.label('rush', p.rush) + ' rushers');
    if (p.cov) b.push(SR.label('cov', p.cov)); else if (p.covf) b.push(SR.label('covf', p.covf).toLowerCase());
    return [a.join(', '), b.length ? 'defense ' + b.join(', ') : ''].filter(Boolean).join('; ');
  }

  function playFromDraft(d) {
    const f = {};
    ['pred', 'pers', 'qb', 'set', 'motion', 'dpers', 'box', 'shell', 'type', 'rush', 'covf', 'cov', 'note'].forEach(k => { if (d[k] != null && d[k] !== '') f[k] = d[k]; });
    if (d.motion && d.motion !== 'none' && d.mread) f.mread = d.mread;
    if (d.rushx && d.rushx.length) f.rushx = d.rushx.slice();
    if (d.tags && d.tags.length) f.tags = d.tags.slice();
    if (d.pen && d.pen.on) f.pen = Object.assign({}, d.pen);
    if (d.type === 'run') { if (d.lane) f.lane = d.lane; if (d.rc) f.rc = d.rc; }
    if (d.type === 'pass') { ['pt', 'pr', 'depth', 'dir', 'pres'].forEach(k => { if (d[k]) f[k] = d[k]; }); }
    if (d.type === 'scramble' || d.type === 'sack') { if (d.pres && d.type === 'scramble') f.pres = d.pres; if (d.pt) f.pt = d.pt; }
    if (needsYards(d)) {
      let y = parseInt(d.yds, 10); if (isNaN(y)) y = 0;
      if (d.type === 'sack') y = -Math.abs(y);
      f.yds = y;
    }
    if (d.type === 'kneel') f.yds = d.yds != null ? parseInt(d.yds, 10) || -1 : -1;
    if (d.fum && (d.type === 'run' || d.type === 'scramble' || d.type === 'sack' || (d.type === 'pass' && d.pr === 'comp'))) f.fum = true;
    if (d.rtd && (f.fum || (d.type === 'pass' && d.pr === 'int'))) f.rtd = true;
    if (d.type === 'fg') f.fgGood = !!d.fgGood;
    return f;
  }
  function draftFromPlay(p) {
    const d = {};
    for (const k in p) {
      if (['id', 't', 'q', 'off', 'down', 'dist', 'spot', 'drive', 'pat'].includes(k)) continue;
      d[k] = Array.isArray(p[k]) ? p[k].slice() : (p[k] && typeof p[k] === 'object') ? Object.assign({}, p[k]) : p[k];
    }
    if (p.yds != null) d.yds = String(p.type === 'sack' ? Math.abs(p.yds) : p.yds);
    return d;
  }

  function canLog(g, d) {
    if (!g) return { ok: false, why: 'Start a game first' };
    if (g.status === 'final') return { ok: false, why: 'Game is final' };
    if (g.sit.pending || !g.sit.off) return { ok: false, why: 'Start the next drive first' };
    if (!d.type) return { ok: false, why: 'Pick what happened' };
    if (d.type === 'nop') return d.pen && d.pen.on ? { ok: true } : { ok: false, why: 'Set the penalty' };
    if (d.type === 'pass' && !d.pr) return { ok: false, why: 'Complete, incomplete or picked?' };
    if (needsYards(d) && (d.yds == null || d.yds === '' || d.yds === '-')) return { ok: false, why: 'Enter the yards' };
    return { ok: true };
  }

  function preview(g, d, sit) {
    const s = sit || g.sit;
    if (!d.type) return '';
    const tmp = Object.assign({ id: 'tmp', q: s.q, off: s.off, down: s.down, dist: s.dist, spot: s.spot, drive: s.drive }, playFromDraft(d));
    const o = SR.outcome(tmp);
    if (o.td) return '<b>Touchdown</b>';
    if (o.defTD) return '<b>Defensive touchdown</b>';
    if (o.safety) return '<b>Safety</b>';
    if (o.turnover === 'int' || o.turnover === 'fum') return '<b>Turnover</b>';
    if (o.turnover === 'downs') return '<b>Turnover on downs</b>';
    const nx = SR.nextSituation(g, tmp);
    return `${o.fd ? '<b>First down</b>, ' : ''}next ${esc(SR.ddText(nx.down, nx.dist, nx.spot))} at ${esc(SR.spotText(g, s.off, nx.spot))}`;
  }

  // ================================================================ chips & groups
  function chips(key, opts, value, o) {
    o = o || {};
    const multi = !!o.multi;
    return `<div class="chips ${o.cls || ''}">` + opts.map(x => {
      const v = x[0], l = x[1], sub = x[2];
      const on = multi ? (value || []).includes(v) : value != null && String(value) === String(v);
      return `<button type="button" class="chip${on ? ' on' : ''}${o.colorize ? ' c-' + v : ''}" data-act="${o.act || 'set'}" data-k="${key}" data-v="${esc(v)}"${multi ? ' data-multi="1"' : ''} aria-pressed="${on}">${esc(l)}${sub ? `<small>${esc(sub)}</small>` : ''}</button>`;
    }).join('') + '</div>';
  }
  function group(field, title, body, focus, hint, info) {
    const inFocus = focus && focus.fields.includes(field);
    const topic = info === false ? null : SR.FIELD_TOPIC[field];
    return `<section class="grp${inFocus ? ' focus' : ''}" data-field="${field}">
      <div class="grp-h"><h3>${esc(title)}</h3>${hint ? `<span class="hint">${esc(hint)}</span>` : ''}${topic ? `<button type="button" class="info" data-act="learn" data-v="${topic}" aria-label="How to read: ${esc(title)}">?</button>` : ''}</div>
      ${body}</section>`;
  }
  function isVis(field, focus, mode) {
    if (mode === 'edit') return true;
    return UI.more || DB.settings.core.includes(field) || (focus && focus.fields.includes(field));
  }

  // ================================================================ field strip
  function strip(g, side, spot, dist, act) {
    const W = 1200, H = 64, X = y => 100 + y * 10;
    let s = `<svg class="strip" viewBox="0 0 ${W} ${H}" ${act ? `data-act="strip" data-k="${act}" role="slider" aria-label="Ball position" aria-valuenow="${spot}"` : 'role="img" aria-label="Field position"'}>`;
    s += `<rect class="f" x="0" y="0" width="${W}" height="${H}"/><rect class="ez" x="0" y="0" width="100" height="${H}"/><rect class="ez" x="1100" y="0" width="100" height="${H}"/><rect class="rz" x="900" y="0" width="200" height="${H}"/>`;
    for (let y = 5; y < 100; y += 5) s += `<line class="${y % 10 ? 'yl5' : 'yl'}" x1="${X(y)}" x2="${X(y)}" y1="${y % 10 ? 22 : 0}" y2="${y % 10 ? 42 : H}"/>`;
    s += `<line class="yl" x1="100" x2="100" y1="0" y2="${H}"/><line class="yl" x1="1100" x2="1100" y1="0" y2="${H}"/>`;
    for (let y = 10; y < 100; y += 10) s += `<text class="yn" x="${X(y)}" y="${H - 6}" text-anchor="middle">${y <= 50 ? y : 100 - y}</text>`;
    s += `<text class="ezl" x="50" y="${H / 2 + 6}" text-anchor="middle">${esc(g[side] || '')}</text><text class="ezl" x="1150" y="${H / 2 + 6}" text-anchor="middle">${esc(g[SR.other(side)] || '')}</text>`;
    if (dist && spot + dist < 100) s += `<line class="ltg" x1="${X(spot + dist)}" x2="${X(spot + dist)}" y1="0" y2="${H}"/>`;
    s += `<line class="los" x1="${X(spot)}" x2="${X(spot)}" y1="0" y2="${H}"/>`;
    s += `<ellipse class="ball" cx="${X(spot)}" cy="${H / 2 - 4}" rx="13" ry="8"/>`;
    s += `<polygon class="arrow" points="${X(spot) + 22},${H / 2 - 10} ${X(spot) + 32},${H / 2 - 4} ${X(spot) + 22},${H / 2 + 2}"/>`;
    return s + '</svg>';
  }

  // ================================================================ lane picker & landing grid
  function laneSVG(sel) {
    const W = 600, H = 132;
    const lanes = [['LE', 0, 150, 'Outside'], ['LI', 150, 262, 'Inside'], ['M', 262, 338, 'Middle'], ['RI', 338, 450, 'Inside'], ['RE', 450, 600, 'Outside']];
    let s = `<svg class="lanes" viewBox="0 0 ${W} ${H}" role="group" aria-label="Run lane, from the offense's view"><rect class="bg" x="0" y="0" width="${W}" height="${H}"/>`;
    s += `<line class="los" x1="0" x2="${W}" y1="58" y2="58"/>`;
    s += `<text class="lt" x="16" y="24">Left</text><text class="lt" x="${W - 16}" y="24" text-anchor="end">Right</text>`;
    for (const [v, a, b, l] of lanes) {
      s += `<rect class="lane${sel === v ? ' on' : ''}" x="${a}" y="0" width="${b - a}" height="${H}" data-act="set" data-k="lane" data-v="${v}" role="button" aria-label="${l} ${v[0] === 'L' ? 'left' : v[0] === 'R' ? 'right' : ''}" aria-pressed="${sel === v}"/>`;
      s += `<text class="lt" x="${(a + b) / 2}" y="${H - 16}" text-anchor="middle">${l}</text>`;
    }
    for (const x of [150, 262, 338, 450]) s += `<line class="sep" x1="${x}" x2="${x}" y1="34" y2="${H - 34}"/>`;
    for (const x of [183, 240, 357, 414]) s += `<circle class="ol" cx="${x}" cy="72" r="13" pointer-events="none"/>`;
    s += `<rect class="olc" x="287" y="59" width="26" height="26" rx="4" pointer-events="none"/>`;
    return s + '</svg>';
  }
  function landingGrid(d) {
    let s = '<div class="lgrid" role="group" aria-label="Where the ball went, from the offense\'s view"><div></div>' + SR.OPT.dir.map(x => `<div class="ch">${x[1]}</div>`).join('');
    for (const [dv, dl, dsub] of SR.OPT.depth) {
      s += `<div class="rh">${dl}<small>${dsub}</small></div>`;
      for (const [x] of SR.OPT.dir) {
        const on = d.depth === dv && d.dir === x;
        s += `<button type="button" class="cell${on ? ' on' : ''}${dv === 'bl' ? ' los' : ''}" data-act="cell" data-v="${dv}${x}" aria-pressed="${on}" aria-label="${dl} ${dsub} ${dirWord[x]}">${on ? '●' : ''}</button>`;
      }
    }
    return s + '</div>';
  }
  function statGrid(grid) {
    let max = 0;
    for (const [dv] of SR.OPT.depth) for (const [x] of SR.OPT.dir) max = Math.max(max, grid[dv + x].att);
    let s = '<div class="lgrid" role="table" aria-label="Pass chart"><div></div>' + SR.OPT.dir.map(x => `<div class="ch">${x[1]}</div>`).join('');
    for (const [dv, dl, dsub] of SR.OPT.depth) {
      s += `<div class="rh">${dl}<small>${dsub}</small></div>`;
      for (const [x] of SR.OPT.dir) {
        const c = grid[dv + x];
        const a = max ? c.att / max : 0;
        s += `<div class="cell${dv === 'bl' ? ' los' : ''}" style="background:rgba(57,135,229,${(a * 0.7).toFixed(2)})">${c.att ? `<b>${c.comp}/${c.att}</b><small>${c.yds} yds${c.int ? `, ${c.int} INT` : ''}</small>` : '<small>–</small>'}</div>`;
      }
    }
    return s + '</div>';
  }

  // ================================================================ top bar & tabs
  function renderTop() {
    const g = cur();
    const el = $('#top');
    if (!g) {
      el.innerHTML = `<div class="brand">Snap<span>/</span>Read</div><div class="top-spacer"></div><button class="tbtn primary" data-act="newgame">New game</button>`;
      return;
    }
    const sc = SR.score(g), s = g.sit, my = SR.mySide(g);
    const poss = side => s.off === side && !s.pending && g.status !== 'final';
    const tm = side => `<div class="tm${poss(side) ? ' poss' : ''}${my === side ? ' mine' : ''}"><span class="ab">${poss(side) ? BALL : ''}${esc(g[side])}</span><b>${sc[side]}</b></div>`;
    let sit;
    if (g.status === 'final') sit = `<div class="sitbtn"><span class="dd">Final</span></div>`;
    else if (s.pending) sit = `<button class="sitbtn" data-act="pending"><span class="dd">${s.pending.kind === 'pat' ? 'Try' : 'Kickoff'}</span><span class="edit">tap to set</span></button>`;
    else if (s.off) sit = `<button class="sitbtn" data-act="sheet" data-v="situation" aria-label="Edit down, distance and ball spot"><span class="dd">${esc(SR.ddText(s.down, s.dist, s.spot))}</span><span class="on">${esc(SR.spotText(g, s.off, s.spot))}</span><span class="edit">edit</span></button>`;
    else sit = '';
    el.innerHTML = `<div class="scorebug">${tm('away')}<span class="q">${s.q <= 4 ? 'Q' + s.q : 'OT'}</span>${tm('home')}</div>${sit}<div class="top-spacer"></div>` +
      (UI.tab === 'track' && g.plays.length ? `<button class="tbtn" data-act="undo" aria-label="Undo last snap">${ICON.undo}<span class="lbl">Undo</span></button>` : '') +
      `<button class="tbtn" data-act="sheet" data-v="menu" aria-label="Game menu">${ICON.more}<span class="lbl">Game</span></button>`;
  }
  const TABS = [['track', 'Track'], ['plays', 'Plays'], ['stats', 'Stats'], ['report', 'Report'], ['learn', 'Learn'], ['season', 'Season']];
  function renderTabs() {
    const g = cur();
    const halftime = g && g.sit.q === 3 && !g.plays.some(p => p.q >= 3) && g.plays.length > 0;
    $('#tabs').innerHTML = TABS.map(([id, l]) => `<button data-act="tab" data-v="${id}"${UI.tab === id ? ' aria-current="page"' : ''}>${ICON[id]}<span>${l}</span>${id === 'report' && halftime ? '<i class="dot" aria-label="Halftime report ready"></i>' : ''}</button>`).join('');
  }

  // ================================================================ TRACK
  function viewTrack() {
    const g = cur();
    if (!g) return emptyStart();
    const two = window.matchMedia('(min-width: 1000px)').matches;
    const s = g.sit, d = g.draft || (g.draft = {});
    let banner = '';
    if (g.status === 'final') banner = `<div class="banner"><p><b>Final</b>This game is over. The Report tab has the full breakdown.</p><button class="btn sm" data-act="reopen">Reopen</button><button class="btn primary sm" data-act="tab" data-v="report">Report</button></div>`;
    else if (s.pending) banner = pendingBanner(g);
    const field = s.off && !s.pending && g.status !== 'final' ? `<div class="fieldbar">${strip(g, s.off, s.spot, s.dist, null)}</div>` : '';
    return `<div class="track${two ? ' two' : ''}" data-draft="live">${field}${banner}<div class="cols"><div class="col pre" data-keep="pre">${preCol(g, d, 'live')}</div><div class="col post"><div class="col-scroll" data-keep="post">${postCol(g, d, 'live')}</div>${logBar(g, d)}</div></div></div>`;
  }
  function emptyStart() {
    const my = DB.settings.my;
    return `<div class="page"><div class="empty"><h2>${my ? `Ready for ${esc(SR.teamName(my))} football` : 'Track a game, snap by snap'}</h2>
      <p>Log what you see before and after every snap. Tendencies build up as you go, and the Report tab turns them into a halftime scouting report.</p>
      ${my ? '' : '<p class="small">First, pick the team you follow. Its games build your season trends.</p>'}
      <button class="btn primary" data-act="${my ? 'newgame' : 'sheet'}" data-v="myteam">${my ? 'New game' : 'Pick your team'}</button></div></div>`;
  }
  function pendingBanner(g) {
    const p = g.sit.pending;
    if (p.kind === 'pat') return `<div class="banner"><p><b>Touchdown, ${esc(g[p.side])}</b>Log the try: extra point or two-point attempt.</p><button class="btn primary sm" data-act="sheet" data-v="pat">Log the try</button></div>`;
    const why = { kickoff: g.plays.length ? 'Kickoff' : 'Opening kickoff', punt: 'After the punt', int: 'After the interception', fum: 'After the fumble', downs: 'Turnover on downs', fgmiss: 'After the missed field goal', safety: 'Free kick after the safety', half: '2nd-half kickoff' }[p.reason] || 'New drive';
    return `<div class="banner"><p><b>${why}</b>${p.side ? `${esc(g[p.side])} ball. Set where the drive starts.` : 'Who receives, and where does the drive start?'}</p><button class="btn primary sm" data-act="sheet" data-v="drive">Start drive</button></div>`;
  }

  function coachCard(g, focus) {
    const s = g.sit;
    if (!s.off || s.pending || g.status === 'final') return '';
    const sc = SR.score(g), def = SR.other(s.off);
    const tips = SR.situationHint(s, sc[s.off], sc[def]);
    const hb = SR.defHabit(allPlays(), g[def], g.id, s.down, s.dist);
    const hl = [];
    if (hb.rush.n >= 2) hl.push(`blitzed ${hb.rush.blitz} of ${hb.rush.n}`);
    if (hb.shell.n >= 2) hl.push(hb.shell.two * 2 >= hb.shell.n ? `2-high ${hb.shell.two} of ${hb.shell.n}` : `single-high ${hb.shell.n - hb.shell.two} of ${hb.shell.n}`);
    const auto = !g.focus || g.focus === 'auto';
    return `<div class="coach">
      <button class="focusline" data-act="sheet" data-v="focus"><span><span class="lbl">${auto ? `Focus for Q${Math.min(s.q, 4)}` : 'Your focus'}</span><br><span class="nm">${esc(focus.name)}</span></span><span class="chg">Change</span></button>
      ${DB.settings.tips ? `<p class="cuetext">${esc(focus.cue)}</p>` : ''}
      <div class="tips">${tips.map(t => `<p class="tip"><b>${esc(t[0])}</b>${esc(t[1])}</p>`).join('')}${hl.length ? `<p class="tip habit"><b>${esc(g[def])} defense on ${esc(hb.bucket)} today</b>${hl.join(', ')}.</p>` : ''}</div>
    </div>`;
  }

  function tendencyBlock(g, d) {
    const s = g.sit;
    if (!s.off || s.pending) return '';
    const T = g[s.off];
    const t = SR.tendency(allPlays(), T, g.id, { pers: d.pers, qb: d.qb, down: s.down, dist: s.dist });
    if (!t) return `<div class="tend"><p class="ctx">No ${esc(T)} snaps logged yet. The tendency meter fills in as you log.</p></div>`;
    const G = t.game, S = t.season;
    const run = G.run + S.run, pass = G.pass + S.pass, n = run + pass;
    const rp = n ? (100 * run) / n : 50;
    const parts = [];
    if (G.n) parts.push(`${G.run} run, ${G.pass} pass today`);
    if (S.n) parts.push(`${S.run} run, ${S.pass} pass in earlier games`);
    return `<div class="tend"><div class="bar" role="img" aria-label="${run} runs and ${pass} passes in this look">${run ? `<i class="r" style="width:${rp}%"></i>` : ''}${pass ? `<i class="p" style="width:${100 - rp}%"></i>` : ''}</div>
      <div class="row"><span class="r"><span class="legend-dot r"></span>Run <b>${run}</b></span><span class="p">Pass <b>${pass}</b> <span class="legend-dot p"></span></span></div>
      <p class="ctx">${t.all ? `${esc(T)} overall` : `${esc(T)} with ${esc(t.label)}`}: ${parts.join('; ')}${t.thin ? '. Small sample.' : '.'}${t.all && (d.pers || d.qb) ? ' Nothing logged in this exact look yet.' : ''}</p></div>`;
  }

  function preCol(g, d, mode) {
    const focus = mode === 'live' ? SR.focusFor(g) : null;
    const vis = f => isVis(f, focus, mode);
    const s = mode === 'edit' ? d._sit : g.sit;
    const out = [`<div class="col-h"><h2>Before the snap</h2>${s && s.off ? `<span class="sub">${esc(g[s.off])} offense</span>` : ''}</div>`];
    if (mode === 'live') out.push(coachCard(g, focus));
    if (vis('pred')) out.push(group('pred', 'Your call', chips('pred', SR.OPT.pred, d.pred, { colorize: true, cls: 'big fill' }) + (mode === 'live' ? tendencyBlock(g, d) : ''), focus, 'run or pass?'));
    else if (mode === 'live') out.push(group('tend', 'Tendency in this look', tendencyBlock(g, d), focus, '', false));
    let rep = '';
    if (mode === 'live' && s && s.off) {
      const last = g.plays.slice().reverse().find(p => p.off === s.off && SR.isSnap(p) && (p.pers || p.qb));
      if (last && (last.pers !== d.pers || last.qb !== d.qb)) {
        const what = [last.pers ? last.pers + ' personnel' : '', last.qb ? SR.label('qb', last.qb).toLowerCase() : '', last.set ? SR.label('set', last.set) : ''].filter(Boolean).join(', ');
        rep = `<button type="button" class="repeat" data-act="repeat" data-v="${last.id}">Same look as their last snap: ${esc(what)}</button>`;
      }
    }
    if (vis('pers')) out.push(group('pers', 'Offensive personnel', rep + chips('pers', SR.OPT.pers, d.pers), focus, 'backs + tight ends'));
    if (vis('qb')) out.push(group('qb', 'QB alignment', chips('qb', SR.OPT.qb, d.qb), focus));
    if (vis('set')) out.push(group('set', 'Formation', chips('set', SR.OPT.set, d.set), focus));
    if (vis('motion')) {
      let b = chips('motion', SR.OPT.motion, d.motion);
      if (d.motion && d.motion !== 'none') b += `<div class="grp-h" style="margin:12px 0 8px"><h3>Defense’s reaction</h3><span class="hint">the man across from him</span></div>` + chips('mread', SR.OPT.mread, d.mread);
      out.push(group('motion', 'Motion', b, focus));
    }
    if (vis('shell')) out.push(group('shell', 'Safeties', chips('shell', SR.OPT.shell, d.shell, { cls: 'fill' }), focus, 'deep at the snap'));
    if (vis('box')) out.push(group('box', 'Box count', chips('box', SR.OPT.box, d.box, { cls: 'fill' }), focus));
    if (vis('dpers')) out.push(group('dpers', 'Defensive personnel', chips('dpers', SR.OPT.dpers, d.dpers), focus));
    if (mode === 'live') out.push(`<button class="morebtn" data-act="more">${UI.more ? 'Show only my fields' : 'Show every field'}</button>`);
    return out.join('');
  }

  function postCol(g, d, mode) {
    const focus = mode === 'live' ? SR.focusFor(g) : null;
    const vis = f => isVis(f, focus, mode);
    const out = [`<div class="col-h"><h2>The play</h2>${mode === 'live' ? '<span class="sub">left/right = offense’s view</span>' : ''}</div>`];
    const special = d.type && !SCRIM.includes(d.type) ? SR.label('special', d.type) : null;
    out.push(group('type', 'What happened', `<div class="chips big">${SR.OPT.type.map(([v, l]) => `<button type="button" class="chip c-${v}${d.type === v ? ' on' : ''}" data-act="set" data-k="type" data-v="${v}" aria-pressed="${d.type === v}">${l}</button>`).join('')}<button type="button" class="chip ghost${special ? ' on' : ''}" data-act="sheet" data-v="special">${special ? esc(special) : 'Special…'}</button></div>`, focus, '', false));
    // required first: where it went and the yards
    if (d.type === 'run') out.push(group('lane', 'Where it went', laneSVG(d.lane), focus));
    if (d.type === 'pass') {
      out.push(group('pr', 'Result', chips('pr', SR.OPT.pr, d.pr, { cls: 'fill' }), focus, '', false));
      out.push(group('depth', 'Where the ball went', landingGrid(d), focus, 'tap a box'));
    }
    if (needsYards(d) || d.type === 'kneel') out.push(group('yds', d.type === 'sack' ? 'Yards lost' : 'Yards gained', yardsBlock(g, d, mode), focus, '', false));
    // then the optional reads
    if (d.type === 'run' && vis('rc')) out.push(group('rc', 'Run concept', chips('rc', SR.OPT.rc, d.rc), focus, 'watch the guards'));
    if (d.type === 'pass' && vis('pt')) out.push(group('pt', 'Pass type', chips('pt', SR.OPT.pt, d.pt), focus));
    if ((d.type === 'pass' || d.type === 'scramble') && vis('pres')) out.push(group('pres', 'Pocket', chips('pres', SR.OPT.pres, d.pres), focus));
    if (!d.type || SCRIM.includes(d.type)) {
      if (vis('rush')) {
        let b = chips('rush', SR.OPT.rush, d.rush, { cls: 'fill' });
        if (vis('rushx')) b += `<div class="grp-h" style="margin:12px 0 8px"><h3>Who brought it</h3></div>` + chips('rushx', SR.OPT.rushx, d.rushx, { multi: true });
        out.push(group('rush', 'Rushers', b, focus, '5+ = blitz'));
      }
      if (vis('covf') || vis('cov')) {
        let b = chips('covf', SR.OPT.covf, d.covf || (d.cov ? SR.COV_FAMILY[d.cov] : null), { cls: 'fill' });
        if (vis('cov')) b += `<div class="grp-h" style="margin:12px 0 8px"><h3>Which coverage</h3><span class="hint">if you saw it</span></div>` + chips('cov', SR.OPT.cov, d.cov);
        out.push(group('cov', 'Coverage', b, focus));
      }
    }
    out.push(group('flags', 'Also', flagsRow(d), focus, '', false));
    return out.join('');
  }

  function yardsBlock(g, d, mode) {
    const s = mode === 'edit' ? d._sit : g.sit;
    const v = d.yds == null ? '' : String(d.yds);
    let shown;
    if (v === '' || v === '-') shown = v === '-' ? '−' : '–';
    else if (d.type === 'sack') shown = v.replace('-', '');
    else shown = v.startsWith('-') ? '−' + v.slice(1) : '+' + v;
    const lbl = d.type === 'sack' ? 'Loss' : 'Gain';
    const nx = canLog(g, d).ok || mode === 'edit' ? preview(g, d, s) : '';
    return `<div class="yards"><div class="ydisp"><span class="lbl">${lbl}</span><span class="v${v === '' ? ' empty' : ''}">${shown}</span><span class="nx">${nx}</span></div>
      <div class="keys">
        <button data-act="key" data-v="1">1</button><button data-act="key" data-v="2">2</button><button data-act="key" data-v="3">3</button>${d.type === 'sack' ? '<button class="s" disabled>loss</button>' : '<button class="s" data-act="key" data-v="neg" aria-label="Loss">±</button>'}
        <button data-act="key" data-v="4">4</button><button data-act="key" data-v="5">5</button><button data-act="key" data-v="6">6</button><button class="s" data-act="key" data-v="first" aria-label="Exactly to the line to gain">1st</button>
        <button data-act="key" data-v="7">7</button><button data-act="key" data-v="8">8</button><button data-act="key" data-v="9">9</button><button class="s" data-act="key" data-v="td" aria-label="To the end zone">TD</button>
        <button class="z" data-act="key" data-v="0">0</button><button class="z s" data-act="key" data-v="del" aria-label="Delete">⌫</button>
      </div></div>`;
  }

  function flagsRow(d) {
    const canFum = d.type === 'run' || d.type === 'scramble' || d.type === 'sack' || (d.type === 'pass' && d.pr === 'comp');
    const pen = d.pen && d.pen.on ? `Flag on ${d.pen.on === 'off' ? 'offense' : 'defense'}, ${d.pen.yds}${d.pen.noPlay ? ', no play' : ''}` : 'Penalty';
    const nt = (d.tags && d.tags.length ? d.tags.map(t => SR.label('tags', t)).join(', ') : '') + (d.note ? (d.tags && d.tags.length ? ', note' : 'Note') : '');
    return `<div class="flags">
      <button class="flag${d.pen && d.pen.on ? ' on' : ''}" data-act="sheet" data-v="penalty">${ICON.flag}${esc(pen)}</button>
      ${canFum ? `<button class="flag${d.fum ? ' on' : ''}" data-act="toggle" data-k="fum" aria-pressed="${!!d.fum}">Fumble lost</button>` : ''}
      ${(d.fum && canFum) || (d.type === 'pass' && d.pr === 'int') ? `<button class="flag${d.rtd ? ' on' : ''}" data-act="toggle" data-k="rtd" aria-pressed="${!!d.rtd}">Returned for TD</button>` : ''}
      <button class="flag${nt ? ' on' : ''}" data-act="sheet" data-v="notes">${esc(nt || 'Tags & note')}</button>
    </div>`;
  }

  function logBar(g, d) {
    const c = canLog(g, d);
    let sub = '';
    if (c.ok) {
      const bits = [];
      if (d.pers) bits.push(d.pers);
      if (d.qb) bits.push(SR.label('qb', d.qb).toLowerCase());
      if (d.shell) bits.push(SR.label('shell', d.shell));
      if (d.rush) bits.push(SR.label('rush', d.rush) + ' rush');
      sub = bits.length ? bits.join(', ') : 'no pre-snap reads, that’s fine';
    }
    return `<div class="logbar"><button class="logbtn" data-act="log"${c.ok ? '' : ' disabled'}>${c.ok ? 'Log snap' : esc(c.why)}${sub ? `<small>${esc(sub)}</small>` : ''}</button></div>`;
  }

  // ================================================================ PLAYS
  function viewPlays() {
    const g = cur();
    if (!g) return emptyStart();
    if (!g.plays.length) return `<div class="page"><div class="empty"><h2>No snaps yet</h2><p>Every snap you log shows up here, grouped by drive. Tap one to fix it.</p><button class="btn primary" data-act="tab" data-v="track">Go to Track</button></div></div>`;
    const drives = SR.drives(g).slice().reverse();
    const snaps = g.plays.filter(SR.isSnap).length;
    let h = `<div class="page"><div class="page-h"><h1>Plays</h1><span class="sub">${snaps} snaps in ${drives.length} drives. Tap a snap to edit it.</span></div>`;
    for (const dr of drives) {
      const cls = ['TD', 'FG'].includes(dr.result) ? ' score' : ['Interception', 'Fumble', 'Downs', 'Pick-six', 'Defensive TD', 'Safety', 'Missed FG'].includes(dr.result) ? ' bad' : '';
      h += `<section class="drive"><div class="drive-h"><span class="t">${esc(g[dr.off])} drive</span><span class="m">Started ${esc(SR.spotText(g, dr.off, dr.start))}, Q${Math.min(dr.q, 4)}, ${dr.snaps} snaps, ${dr.yards} yds</span><span class="res${cls}">${esc(dr.result)}</span></div>`;
      for (const p of dr.plays.slice().reverse()) {
        const o = SR.outcome(p), snap = SR.isSnap(p);
        const pill = p.type === 'run' ? '<span class="pill run">Run</span>' : SR.isDropback(p) ? '<span class="pill pass">Pass</span>' : '<span class="pill oth">Other</span>';
        const pre = preLine(p);
        h += `<button class="prow" data-act="editplay" data-v="${p.id}"><span class="sit">${esc(p.down ? SR.ddText(p.down, p.dist, p.spot) : '–')}<small>${esc(SR.spotText(g, p.off, p.spot))}, Q${Math.min(p.q, 4)}</small></span>
          <span class="desc">${pill}${esc(playLine(p))}${p.pred && snap ? ` <span class="muted small">(you said ${p.pred})</span>` : ''}${pre ? `<span class="pre">${esc(pre)}</span>` : ''}${p.note ? `<span class="pre">“${esc(p.note)}”</span>` : ''}</span>
          <span class="yd">${snap ? sgn(o.gain) : ''}${snap ? `<small><span class="sr ${SR.success(Object.assign({}, p, { o }) ) ? 'g' : 'b'}">${SR.success(Object.assign({}, p, { o })) ? 'success' : 'no'}</span></small>` : ''}</span></button>`;
      }
      h += '</section>';
    }
    return h + '</div>';
  }

  // ================================================================ STATS
  function tiles(list) {
    return `<div class="tiles">${list.map(t => `<div class="tile"><div class="l">${esc(t[0])}</div><div class="v">${t[1]}</div>${t[2] ? `<div class="s">${t[2]}</div>` : ''}</div>`).join('')}</div>`;
  }
  function split(run, pass) {
    const n = run + pass;
    if (!n) return '<div class="sbar"><i class="u" style="width:100%"></i></div>';
    const r = (100 * run) / n;
    return `<div class="sbar" role="img" aria-label="${run} run, ${pass} pass">${run ? `<i class="r" style="width:${r}%"></i>` : ''}${pass ? `<i class="p" style="width:${100 - r}%"></i>` : ''}</div>`;
  }
  function srCell(k, n) {
    if (!n) return '<span class="muted">—</span>';
    const r = k / n;
    return `<span class="sr ${r >= 0.5 ? 'g' : r < 0.35 ? 'b' : ''}">${P(k, n)}</span>`;
  }
  const legendRP = '<div class="legend"><span><span class="legend-dot r"></span>Run</span><span><span class="legend-dot p"></span>Pass</span><span class="muted">Success: <span class="sr g">50%+</span> <span class="sr b">under 35%</span></span></div>';
  function rpTable(groups, firstCol) {
    if (!groups.length) return '<p class="muted small">Nothing logged here yet.</p>';
    return `<table class="t"><thead><tr><th>${firstCol}</th><th>Run / pass</th><th class="r">Snaps</th><th class="r">Pass</th><th class="r">Success</th><th class="r">Yds/play</th></tr></thead><tbody>` +
      groups.map(gr => `<tr><td class="lbl">${esc(gr.label)}</td><td class="barcell">${split(gr.a.runs, gr.a.db)}</td><td class="r">${gr.a.n}</td><td class="r">${gr.a.db} <span class="muted">(${P(gr.a.db, gr.a.n)})</span></td><td class="r">${srCell(gr.a.succ, gr.a.n)}</td><td class="r">${f1(gr.a.ypp)}</td></tr>`).join('') + '</tbody></table>';
  }
  function shareTable(rows, cols) {
    // rows: [{label, k, n, extra:[...]}]
    if (!rows.length) return '<p class="muted small">Nothing logged here yet.</p>';
    const max = Math.max(...rows.map(r => r.k), 1);
    return `<table class="t"><thead><tr><th>${cols[0]}</th><th></th>${(cols.slice(2)).map(c => `<th class="r">${c}</th>`).join('')}</tr></thead><tbody>` +
      rows.map(r => `<tr><td class="lbl">${esc(r.label)}</td><td class="barcell"><div class="hbar" style="width:${(100 * r.k) / max}%"></div></td>${r.extra.map(x => `<td class="r">${x}</td>`).join('')}</tr>`).join('') + '</tbody></table>';
  }
  function coverage(rate, names) {
    const parts = Object.keys(rate).map(k => `${names[k] || k} ${rate[k].k}/${rate[k].n}`);
    return `<p class="muted small" style="margin-top:12px">Logged: ${esc(parts.join(', '))}. Rates only use snaps where you logged that read.</p>`;
  }

  function statsUnits(g) {
    const my = SR.mySide(g) || 'home', opp = SR.other(my);
    return { myoff: [g[my], 'off'], mydef: [g[my], 'def'], oppoff: [g[opp], 'off'], oppdef: [g[opp], 'def'] };
  }

  function viewStats() {
    const g = cur();
    const myT = DB.settings.my;
    if (!g && !myT) return emptyStart();
    const st = UI.stats;
    if (!g) st.scope = 'season';
    let T, lens, plays;
    const all = allPlays();
    let unitSeg;
    if (st.scope === 'game' && g) {
      const U = statsUnits(g);
      if (!U[st.unit]) st.unit = 'myoff';
      [T, lens] = U[st.unit];
      plays = all.filter(p => p.gid === g.id);
      unitSeg = Object.keys(U).map(k => `<button data-act="sunit" data-v="${k}" aria-pressed="${st.unit === k}">${esc(U[k][0])} ${U[k][1] === 'off' ? 'offense' : 'defense'}</button>`).join('');
    } else {
      T = myT || (g && g.home);
      if (!['myoff', 'mydef'].includes(st.unit)) st.unit = 'myoff';
      lens = st.unit === 'myoff' ? 'off' : 'def';
      plays = all.filter(p => p.offT === T || p.defT === T);
      unitSeg = `<button data-act="sunit" data-v="myoff" aria-pressed="${st.unit === 'myoff'}">${esc(T)} offense</button><button data-act="sunit" data-v="mydef" aria-pressed="${st.unit === 'mydef'}">${esc(T)} defense</button>`;
    }
    if (st.period !== 'all') plays = plays.filter(p => p.half === (st.period === 'h1' ? 1 : 2));
    const mine = plays.filter(p => (lens === 'off' ? p.offT === T : p.defT === T));
    const filt = `<div class="filters"><div class="seg">${g ? `<button data-act="sscope" data-v="game" aria-pressed="${st.scope === 'game'}">This game</button>` : ''}<button data-act="sscope" data-v="season" aria-pressed="${st.scope === 'season'}">Season</button></div>
      <div class="seg">${unitSeg}</div>
      <div class="seg"><button data-act="speriod" data-v="all" aria-pressed="${st.period === 'all'}">Full</button><button data-act="speriod" data-v="h1" aria-pressed="${st.period === 'h1'}">1st half</button><button data-act="speriod" data-v="h2" aria-pressed="${st.period === 'h2'}">2nd half</button></div></div>`;
    const snaps = mine.filter(SR.isSnap).length;
    if (!snaps) return filt + `<div class="page"><div class="empty"><h2>No snaps here yet</h2><p>Log a few ${esc(T)} ${lens === 'off' ? 'offensive' : 'defensive'} snaps and this page fills in.</p></div></div>`;
    const body = lens === 'off' ? offDash(mine, T, st.scope, g) : defDash(mine, T, st.scope, g);
    return filt + `<div class="page">${body}</div>`;
  }

  function offDash(plays, T, scope, g) {
    const R = SR.offense(plays);
    const a = R.all;
    let h = tiles([
      ['Snaps', a.n, `${a.runs} run, ${a.db} pass`],
      ['Success rate', P(a.succ, a.n), `${a.succ} of ${a.n}`],
      ['Yards per play', f1(a.ypp), `${a.yds} yds`],
      ['Pass rate', P(a.db, a.n), 'dropbacks'],
      ['Early-down pass', P(R.early.db, R.early.n), `${R.early.db} of ${R.early.n} on 1st/2nd`],
      ['3rd down', R.third.att ? `${R.third.conv}/${R.third.att}` : '—', 'converted'],
      ['Explosive plays', R.explosives.length, 'runs 10+, passes 20+'],
      ['Turnovers', R.turnovers, '']
    ]);
    const ins = SR.offenseInsights(R, T).slice(0, 5);
    if (ins.length) h += `<div class="panel" style="margin-top:14px"><h2>What stands out</h2><ul class="ins">${ins.map(i => `<li>${esc(i.text)}</li>`).join('')}</ul></div>`;
    h += `<div class="panel" style="margin-top:14px"><h2>Run / pass by situation</h2><p class="lede">How the call changes with down and distance.</p>${legendRP}${rpTable(R.byBucket, 'Situation')}</div>`;
    h += `<div class="grid2" style="margin-top:14px"><div class="panel"><h2>Personnel</h2><p class="lede">Each grouping’s run/pass mix. Lopsided rows are tells.</p>${rpTable(R.byPers, 'Personnel')}</div>`;
    h += `<div class="panel"><h2>Formation</h2><p class="lede">QB alignment, then receiver sets.</p>${rpTable(R.byQb, 'QB')}${R.bySet.length ? '<h3>Sets</h3>' + rpTable(R.bySet, 'Set') : ''}</div></div>`;
    const m = R.motion;
    h += `<div class="grid2" style="margin-top:14px"><div class="panel"><h2>Motion</h2><p class="lede">${m.known ? `Motion on ${m.yes} of ${m.known} snaps where you logged it (${P(m.yes, m.known)}).` : 'Log motion to see how this offense uses it.'}</p>`;
    if (m.known) {
      h += `<table class="t"><thead><tr><th></th><th class="r">Snaps</th><th class="r">Pass</th><th class="r">Success</th><th class="r">Yds/play</th></tr></thead><tbody>
        <tr><td class="lbl">With motion</td><td class="r">${m.withA.n}</td><td class="r">${P(m.withA.db, m.withA.n)}</td><td class="r">${srCell(m.withA.succ, m.withA.n)}</td><td class="r">${f1(m.withA.ypp)}</td></tr>
        <tr><td class="lbl">No motion</td><td class="r">${m.withoutA.n}</td><td class="r">${P(m.withoutA.db, m.withoutA.n)}</td><td class="r">${srCell(m.withoutA.succ, m.withoutA.n)}</td><td class="r">${f1(m.withoutA.ypp)}</td></tr></tbody></table>`;
      if (m.byType.length) h += '<h3>Types</h3>' + shareTable(m.byType.map(x => ({ label: x.label, k: x.a.n, extra: [x.a.n, P(x.a.db, x.a.n) + ' pass'] })), ['Motion', 'Count', 'Snaps', 'Pass']);
      if (m.read.length) h += '<h3>Defense’s reaction</h3>' + shareTable(m.read.map(x => ({ label: x.label, k: x.plays.length, extra: [x.plays.length] })), ['Reaction', '', 'Times']);
    }
    h += '</div>';
    // run game
    const lanesRows = R.run.byLane.map(x => ({ label: x.label, k: x.a.n, extra: [x.a.n, f1(x.a.ypp), srCell(x.a.succ, x.a.n)] }));
    h += `<div class="panel"><h2>Run game</h2><p class="lede">${R.run.a.n} runs, ${f1(R.run.a.n ? R.run.a.yds / R.run.a.n : 0)} yds per carry, ${P(R.run.a.succ, R.run.a.n)} successful.</p>`;
    h += lanesRows.length ? shareTable(lanesRows, ['Lane', 'Carries', 'Runs', 'Per carry', 'Success']) : '<p class="muted small">Tap the lane on runs to see where they go.</p>';
    if (R.run.byConcept.length) h += '<h3>Concepts</h3>' + shareTable(R.run.byConcept.map(x => ({ label: x.label, k: x.a.n, extra: [x.a.n, f1(x.a.ypp), srCell(x.a.succ, x.a.n)] })), ['Concept', 'Carries', 'Runs', 'Per carry', 'Success']);
    if (R.run.byBox.length) h += '<h3>Against the box</h3>' + shareTable(R.run.byBox.map(x => ({ label: x.label + ' in box', k: x.a.n, extra: [x.a.n, f1(x.a.ypp), srCell(x.a.succ, x.a.n)] })), ['Box', 'Carries', 'Runs', 'Per carry', 'Success']);
    h += '</div></div>';
    // pass game
    const ps = R.pass;
    h += `<div class="grid2" style="margin-top:14px"><div class="panel"><h2>Pass chart</h2><p class="lede">Completions/attempts by where the ball went (offense’s view). ${ps.grid.charted} of ${ps.att} attempts charted.</p>${statGrid(ps.grid)}</div>`;
    h += `<div class="panel"><h2>Pass game</h2><p class="lede">${ps.comp} of ${ps.att} for ${ps.yds} yds (${f1(ps.ypa)} per attempt), ${ps.ints} INT, ${ps.sacks} sacks, ${ps.scr} scrambles.${ps.presKnown ? ` Pressured on ${ps.pressured} of ${ps.presKnown} logged dropbacks.` : ''}</p>`;
    h += ps.byType.length ? shareTable(ps.byType.map(x => ({ label: x.label, k: x.a.n, extra: [x.a.n, P(x.plays.filter(p => p.pr === 'comp').length, x.a.n), f1(x.a.ypp), srCell(x.a.succ, x.a.n)] })), ['Type', 'Attempts', 'Att', 'Comp', 'Yds/att', 'Success']) : '<p class="muted small">Log the pass type (quick, play-action, screen…) to compare them.</p>';
    h += '</div></div>';
    if (scope === 'game' && g) h += drivesPanel(g, T);
    if (scope === 'season') h += byGamePanel(T, 'off');
    h += `<div class="panel" style="margin-top:14px"><h2>Your logging</h2>${coverage(R.knownRate, { pers: 'personnel', qb: 'QB', set: 'formation', motion: 'motion', lane: 'run lane', rc: 'run concept', pt: 'pass type' })}</div>`;
    return h;
  }

  function defDash(plays, T, scope, g) {
    const R = SR.defense(plays);
    const a = R.all;
    const two = (R.shell.dist.find(x => x.key === '2') || { plays: [] }).plays.length;
    const man = (R.cov.fam.find(x => x.key === 'man') || { plays: [] }).plays.length;
    let h = tiles([
      ['Snaps faced', a.n, `${a.runs} run, ${a.db} pass`],
      ['Success allowed', P(a.succ, a.n), `${a.succ} of ${a.n}`],
      ['Yards per play', f1(a.ypp), 'allowed'],
      ['Blitz rate', P(R.rush.blitz, R.rush.known), `${R.rush.blitz} of ${R.rush.known} counted`],
      ['2-high rate', P(two, R.shell.known), `${two} of ${R.shell.known} read`],
      ['Man coverage', P(man, R.cov.known), `${man} of ${R.cov.known} read`],
      ['Pressure', P(R.pressure.k, R.pressure.known), `${R.pressure.sacks} sacks`],
      ['3rd-down stops', R.third.att ? `${R.third.stops}/${R.third.att}` : '—', ''],
      ['Takeaways', R.takeaways, '']
    ]);
    const ins = SR.defenseInsights(R).slice(0, 5);
    if (ins.length) h += `<div class="panel" style="margin-top:14px"><h2>What stands out</h2><ul class="ins">${ins.map(i => `<li>${esc(i.text)}</li>`).join('')}</ul></div>`;
    h += `<div class="grid2" style="margin-top:14px"><div class="panel"><h2>Pass rush</h2><p class="lede">Rushers counted on ${R.rush.known} snaps.</p>`;
    h += R.rush.dist.length ? shareTable(R.rush.dist.map(x => ({ label: x.label + ' rushers', k: x.plays.length, extra: [x.plays.length, P(x.plays.length, R.rush.known)] })), ['Rush', 'Snaps', 'Snaps', 'Share']) : '<p class="muted small">Count rushers after the snap to fill this in.</p>';
    if (R.rush.byBucket.length) h += '<h3>Blitz by situation</h3>' + shareTable(R.rush.byBucket.map(b => ({ label: b.label, k: b.k, extra: [`${b.k} of ${b.n}`, P(b.k, b.n)] })), ['Situation', 'Blitzes', 'Blitzed', 'Rate']);
    if (R.rush.blitzA.n || R.rush.fourA.n) h += `<h3>Does it work?</h3><table class="t"><thead><tr><th></th><th class="r">Snaps</th><th class="r">Offense success</th><th class="r">Yds/play</th></tr></thead><tbody>
      <tr><td class="lbl">Blitz (5+)</td><td class="r">${R.rush.blitzA.n}</td><td class="r">${P(R.rush.blitzA.succ, R.rush.blitzA.n)}</td><td class="r">${f1(R.rush.blitzA.ypp)}</td></tr>
      <tr><td class="lbl">4 or fewer</td><td class="r">${R.rush.fourA.n}</td><td class="r">${P(R.rush.fourA.succ, R.rush.fourA.n)}</td><td class="r">${f1(R.rush.fourA.ypp)}</td></tr></tbody></table>`;
    if (R.rush.extras.length) h += '<h3>Pressure types</h3>' + shareTable(R.rush.extras.map(x => ({ label: x.label, k: x.plays.length, extra: [x.plays.length] })), ['Type', '', 'Times']);
    h += '</div>';
    h += `<div class="panel"><h2>Safeties</h2><p class="lede">Shell read on ${R.shell.known} snaps.${R.rotation.n ? ` Rotated after the snap on ${R.rotation.k} of ${R.rotation.n} where you also read the coverage.` : ''}</p>`;
    h += R.shell.dist.length ? shareTable(R.shell.dist.map(x => ({ label: x.label, k: x.plays.length, extra: [x.plays.length, P(x.plays.length, R.shell.known)] })), ['Shell', 'Snaps', 'Snaps', 'Share']) : '<p class="muted small">Find the safeties before the snap to fill this in.</p>';
    if (R.shell.byBucket.length) h += '<h3>2-high by situation</h3>' + shareTable(R.shell.byBucket.map(b => ({ label: b.label, k: b.two, extra: [`${b.two} of ${b.n}`, P(b.two, b.n)] })), ['Situation', '2-high', '2-high', 'Rate']);
    if (R.shell.byPers.length) h += '<h3>2-high vs personnel</h3>' + shareTable(R.shell.byPers.map(b => ({ label: b.label + ' pers.', k: b.two, extra: [`${b.two} of ${b.n}`, P(b.two, b.n)] })), ['Offense', '2-high', '2-high', 'Rate']);
    h += '</div></div>';
    h += `<div class="grid2" style="margin-top:14px"><div class="panel"><h2>Coverage</h2><p class="lede">Coverage read on ${R.cov.known} snaps.</p>`;
    h += R.cov.fam.length ? shareTable(R.cov.fam.map(x => ({ label: x.label, k: x.plays.length, extra: [x.plays.length, P(x.plays.length, R.cov.known)] })), ['Family', 'Snaps', 'Snaps', 'Share']) : '<p class="muted small">Log man or zone (the replay is the best look).</p>';
    if (R.cov.type.length) h += '<h3>Coverages</h3>' + shareTable(R.cov.type.map(x => ({ label: x.label, k: x.plays.length, extra: [x.plays.length, f1(x.a.ypp)] })), ['Coverage', 'Snaps', 'Snaps', 'Yds/play']);
    const cy = R.covYpa.filter(x => x.n);
    if (cy.length) h += '<h3>Yards per attempt allowed</h3>' + shareTable(cy.map(x => ({ label: x.key === 'man' ? 'Man' : 'Zone', k: x.n, extra: [x.n, f1(x.ypa)] })), ['Family', 'Attempts', 'Att', 'Yds/att']);
    if (R.motionRead.n) h += `<p class="small" style="margin-top:12px">Vs motion: a defender travelled ${R.motionRead.man} of ${R.motionRead.n} times (man tell).</p>`;
    h += '</div>';
    h += `<div class="panel"><h2>Box & personnel</h2><p class="lede">Box counted on ${R.box.known} snaps.</p>`;
    h += R.box.dist.length ? shareTable(R.box.dist.map(x => ({ label: x.label + ' in box', k: x.plays.length, extra: [x.plays.length, P(x.plays.length, R.box.known)] })), ['Box', 'Snaps', 'Snaps', 'Share']) : '<p class="muted small">Count the box before the snap to fill this in.</p>';
    if (R.box.runs.length) h += '<h3>Runs against each box</h3>' + shareTable(R.box.runs.map(x => ({ label: x.label + ' in box', k: x.a.n, extra: [x.a.n, f1(x.a.ypp), P(x.a.succ, x.a.n)] })), ['Box', 'Runs', 'Runs', 'Per carry', 'Success']);
    if (R.dpers.dist.length) h += '<h3>Defensive personnel</h3>' + shareTable(R.dpers.dist.map(x => ({ label: x.label, k: x.plays.length, extra: [x.plays.length, P(x.plays.length, R.dpers.known)] })), ['Personnel', 'Snaps', 'Snaps', 'Share']);
    if (R.match.length) h += '<h3>Matching personnel</h3><table class="t"><tbody>' + R.match.map(m => `<tr><td class="lbl">vs ${esc(m.label)}</td><td>${m.d.map(x => `${esc(x.label.split(' (')[0])} ${x.n}`).join(', ')}</td></tr>`).join('') + '</tbody></table>';
    h += '</div></div>';
    if (scope === 'season') h += byGamePanel(T, 'def');
    h += `<div class="panel" style="margin-top:14px"><h2>Your logging</h2>${coverage(R.knownRate, { shell: 'safeties', rush: 'rushers', box: 'box', dpers: 'def. personnel', cov: 'coverage' })}</div>`;
    return h;
  }

  function drivesPanel(g, T) {
    const ds = SR.drives(g).filter(d => g[d.off] === T);
    if (!ds.length) return '';
    const pts = ds.reduce((s, d) => s + d.points, 0);
    return `<div class="panel" style="margin-top:14px"><h2>Drives</h2><p class="lede">${ds.length} drives, ${pts} points (${f1(pts / ds.length)} per drive, touchdowns counted with the try).</p><table class="t"><thead><tr><th>Start</th><th class="r">Q</th><th class="r">Snaps</th><th class="r">Yards</th><th>Result</th></tr></thead><tbody>` +
      ds.map(d => `<tr><td class="lbl">${esc(SR.spotText(g, d.off, d.start))}</td><td class="r">${Math.min(d.q, 4)}</td><td class="r">${d.snaps}</td><td class="r">${d.yards}</td><td>${esc(d.result)}</td></tr>`).join('') + '</tbody></table></div>';
  }

  function byGamePanel(T, lens) {
    const games = DB.games.filter(g => g.home === T || g.away === T).slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    if (games.length < 2) return '';
    const rows = games.map(g => {
      const pl = SR.enrich(g).filter(p => (lens === 'off' ? p.offT === T : p.defT === T));
      const side = g.home === T ? 'home' : 'away';
      const sc = SR.score(g), opp = g[SR.other(side)];
      const res = g.status === 'final' ? (sc[side] > sc[SR.other(side)] ? 'W' : sc[side] < sc[SR.other(side)] ? 'L' : 'T') + ` ${sc[side]}–${sc[SR.other(side)]}` : 'Live';
      if (lens === 'off') {
        const R = SR.offense(pl);
        return `<tr><td class="lbl">${esc(g.week || g.date)}</td><td>${side === 'home' ? 'vs' : '@'} ${esc(opp)}</td><td>${res}</td><td class="r">${R.n}</td><td class="r">${P(R.all.db, R.n)}</td><td class="r">${P(R.early.db, R.early.n)}</td><td class="r">${srCell(R.all.succ, R.n)}</td><td class="r">${f1(R.all.ypp)}</td></tr>`;
      }
      const R = SR.defense(pl);
      const two = (R.shell.dist.find(x => x.key === '2') || { plays: [] }).plays.length;
      const man = (R.cov.fam.find(x => x.key === 'man') || { plays: [] }).plays.length;
      return `<tr><td class="lbl">${esc(g.week || g.date)}</td><td>${side === 'home' ? 'vs' : '@'} ${esc(opp)}</td><td>${res}</td><td class="r">${R.n}</td><td class="r">${P(R.rush.blitz, R.rush.known)}</td><td class="r">${P(two, R.shell.known)}</td><td class="r">${P(man, R.cov.known)}</td><td class="r">${P(R.all.succ, R.n)}</td></tr>`;
    });
    const head = lens === 'off' ? '<th class="r">Snaps</th><th class="r">Pass rate</th><th class="r">Early-down pass</th><th class="r">Success</th><th class="r">Yds/play</th>' : '<th class="r">Snaps</th><th class="r">Blitz</th><th class="r">2-high</th><th class="r">Man</th><th class="r">Success allowed</th>';
    return `<div class="panel" style="margin-top:14px"><h2>Game by game</h2><p class="lede">How ${esc(T)}’s ${lens === 'off' ? 'play-calling' : 'defensive calls'} moved across the season.</p><div style="overflow-x:auto"><table class="t"><thead><tr><th>Week</th><th>Opponent</th><th>Result</th>${head}</tr></thead><tbody>${rows.join('')}</tbody></table></div></div>`;
  }

  // ================================================================ REPORT
  function viewReport() {
    const g = cur();
    if (!g) return emptyStart();
    const plays = allPlays().filter(p => p.gid === g.id);
    const hasH2 = plays.some(p => p.half === 2 && SR.isSnap(p));
    let mode = UI.report || (g.status === 'final' ? 'full' : hasH2 ? 'adjust' : 'half');
    const my = SR.mySide(g) || 'home', opp = SR.other(my);
    const M = g[my], O = g[opp];
    const seg = `<div class="filters"><div class="seg"><button data-act="rmode" data-v="half" aria-pressed="${mode === 'half'}">Halftime</button><button data-act="rmode" data-v="adjust" aria-pressed="${mode === 'adjust'}">2nd half vs 1st</button><button data-act="rmode" data-v="full" aria-pressed="${mode === 'full'}">Full game</button></div></div>`;
    if (!plays.some(SR.isSnap)) return seg + `<div class="page"><div class="empty"><h2>Nothing to report yet</h2><p>Log snaps on the Track tab. At halftime this page becomes a scouting report on both teams.</p></div></div>`;
    let h = seg + '<div class="page">';
    if (mode === 'adjust') {
      if (!hasH2) return h + `<div class="empty"><h2>2nd half hasn’t started</h2><p>Once you log 2nd-half snaps, this compares them with the 1st half so you can see who adjusted.</p></div></div>`;
      h += `<div class="page-h"><h1>Adjustments</h1><span class="sub">2nd half compared with the 1st. Changes of 15+ points with at least 6 snaps in each half are highlighted.</span></div><div class="grid2">`;
      for (const [T, lens, title] of [[M, 'off', `${M} offense`], [M, 'def', `${M} defense`], [O, 'off', `${O} offense`], [O, 'def', `${O} defense`]]) {
        const pl = plays.filter(p => (lens === 'off' ? p.offT === T : p.defT === T));
        const rows = SR.compareHalves(pl, lens);
        h += `<div class="panel"><h2>${esc(title)}</h2>` + (rows.length ? `<table class="t"><thead><tr><th></th><th class="r">1st half</th><th class="r">2nd half</th><th class="r">Change</th></tr></thead><tbody>` +
          rows.map(r => `<tr><td class="lbl">${esc(r.label)}</td><td class="r">${r.n1 ? `${P(r.k1, r.n1)} <span class="muted small">${r.k1}/${r.n1}</span>` : '—'}</td><td class="r">${r.n2 ? `${P(r.k2, r.n2)} <span class="muted small">${r.k2}/${r.n2}</span>` : '—'}</td><td class="r">${r.delta == null ? '' : `<span class="delta${r.big ? ' big' : ''}">${r.delta >= 0 ? '+' : '−'}${Math.abs(Math.round(r.delta * 100))}</span>`}</td></tr>`).join('') + '</tbody></table>' : '<p class="muted small">Not enough logged yet.</p>') + '</div>';
      }
      return h + '</div></div>';
    }
    const per = mode === 'half' ? plays.filter(p => p.half === 1) : plays;
    const offM = SR.offense(per.filter(p => p.offT === M)), offO = SR.offense(per.filter(p => p.offT === O));
    const defM = SR.defense(per.filter(p => p.defT === M)), defO = SR.defense(per.filter(p => p.defT === O));
    const sc = SR.score(g);
    h += `<div class="page-h"><h1>${mode === 'half' ? 'Halftime report' : 'Game report'}</h1><span class="sub">${esc(g.away)} ${sc.away}, ${esc(g.home)} ${sc.home}${mode === 'half' ? ' (current score)' : ''}. ${esc(g.week || '')}</span></div>`;
    const row = (l, a, b) => `<tr><td class="lbl">${l}</td><td class="r">${a}</td><td class="r">${b}</td></tr>`;
    h += `<div class="grid2"><div class="panel"><h2>Head to head</h2><table class="t"><thead><tr><th></th><th class="r">${esc(M)}</th><th class="r">${esc(O)}</th></tr></thead><tbody>` +
      row('Snaps', offM.n, offO.n) + row('Success rate', srCell(offM.all.succ, offM.n), srCell(offO.all.succ, offO.n)) +
      row('Yards per play', f1(offM.all.ypp), f1(offO.all.ypp)) + row('Pass rate', P(offM.all.db, offM.n), P(offO.all.db, offO.n)) +
      row('Early-down pass', P(offM.early.db, offM.early.n), P(offO.early.db, offO.early.n)) +
      row('3rd down', offM.third.att ? `${offM.third.conv}/${offM.third.att}` : '—', offO.third.att ? `${offO.third.conv}/${offO.third.att}` : '—') +
      row('Explosive plays', offM.explosives.length, offO.explosives.length) + row('Turnovers', offM.turnovers, offO.turnovers) +
      row('Blitz rate (defense)', P(defM.rush.blitz, defM.rush.known), P(defO.rush.blitz, defO.rush.known)) +
      '</tbody></table></div>';
    // watch list or reads
    const weak = weakestRead(per);
    const pr = SR.predictions(per);
    if (mode === 'half') {
      const wl = SR.watchList({ my: M, opp: O, offMy: offM, defMy: defM, offOpp: offO, defOpp: defO, weakRead: weak });
      h += `<div class="panel"><h2>Watch in the 2nd half</h2><p class="lede">Built from the strongest 1st-half tendencies. Check the Adjustments view later to see what changed.</p>${wl.length ? `<ul class="ins watch">${wl.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p class="muted small">Log more snaps for a watch list. General things to look for: changes in personnel, more or less motion, blitz rate on 3rd down, and whether the safeties rotate more.</p>'}</div></div>`;
    } else {
      h += readsPanel(pr, weak) + '</div>';
    }
    h += '<div class="grid2" style="margin-top:14px">';
    for (const [title, list, T] of [[`${M} offense`, SR.offenseInsights(offM, M), M], [`${M} defense`, SR.defenseInsights(defM), M], [`${O} offense`, SR.offenseInsights(offO, O), O], [`${O} defense`, SR.defenseInsights(defO), O]]) {
      h += `<div class="panel"><h2>${esc(title)}</h2>${list.length ? `<ul class="ins">${list.slice(0, 4).map(i => `<li>${esc(i.text)}</li>`).join('')}</ul>` : `<p class="muted small">Not enough logged for ${esc(T)} here yet. Tendencies show up after about 4 snaps in the same look.</p>`}</div>`;
    }
    h += '</div>';
    if (mode === 'half') h += `<div class="grid2" style="margin-top:14px">${readsPanel(pr, weak)}<div class="panel"><h2>Halftime adjustments to look for</h2><ul class="ins"><li>Personnel and formation mix: does an offense lean on a different grouping after the break?</li><li>Defensive shell: more single-high (to stop the run) or more 2-high (to stop big plays)?</li><li>Blitz rate, especially on 3rd down.</li><li>Tempo and motion: offenses that struggled often add motion or no-huddle.</li></ul></div></div>`;
    else if (g.status === 'final') h += drivesPanel(g, M) + drivesPanel(g, O);
    return h + '</div>';
  }
  function weakestRead(per) {
    const snaps = per.filter(SR.isSnap);
    if (snaps.length < 8) return null;
    const names = { pers: 'personnel', qb: 'QB alignment', shell: 'safeties', rush: 'rushers' };
    let worst = null;
    for (const f of Object.keys(names)) {
      if (!DB.settings.core.includes(f)) continue;
      const k = snaps.filter(p => p[f]).length;
      const r = k / snaps.length;
      if (r < 0.6 && (!worst || r < worst.r)) worst = { name: names[f], k, n: snaps.length, r };
    }
    return worst;
  }
  function readsPanel(pr, weak) {
    let h = '<div class="panel"><h2>Your reads</h2>';
    if (pr.n) {
      h += `<p style="font:700 34px/1 var(--font-c)">${pr.hits} of ${pr.n} <span class="muted" style="font-size:18px">calls right (${P(pr.hits, pr.n)})</span></p>`;
      const mis = [];
      if (pr.missRunWasPass) mis.push(`you expected run but they passed ${pr.missRunWasPass} time${pr.missRunWasPass === 1 ? '' : 's'}`);
      if (pr.missPassWasRun) mis.push(`you expected pass but they ran ${pr.missPassWasRun} time${pr.missPassWasRun === 1 ? '' : 's'}`);
      if (mis.length) h += `<p class="small" style="margin-top:8px">Misses: ${esc(mis.join('; '))}.</p>`;
      const top = pr.missByPers.slice().sort((a, b) => b.n - a.n)[0];
      if (top && top.n >= 2) h += `<p class="small" style="margin-top:6px">Most misses came against ${esc(top.label)} personnel (${top.n} misses). Check the tendency meter when you see it.</p>`;
      if (pr.byHalf[0].n && pr.byHalf[1].n) h += `<p class="small muted" style="margin-top:6px">1st half ${pr.byHalf[0].hits}/${pr.byHalf[0].n}, 2nd half ${pr.byHalf[1].hits}/${pr.byHalf[1].n}.</p>`;
    } else h += '<p class="muted small">Make a run/pass call before the snap (“Your call”) to track how well you read the game.</p>';
    if (weak) h += `<p class="small" style="margin-top:10px">You logged the ${esc(weak.name)} on ${weak.k} of ${weak.n} snaps. Make it your next focus.</p>`;
    return h + '</div>';
  }

  // ================================================================ LEARN
  function topicHTML(t) {
    let h = `<article class="topic"><h1>${esc(t.title)}</h1><p class="lead">${esc(t.lead)}</p>`;
    if (t.steps) h += `<h2>${t.id === 'routine' ? 'The order' : 'The plan'}</h2><ol class="steps">${t.steps.map(s => `<li><div><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div></li>`).join('')}</ol>`;
    if (t.table) h += `<h2>What you’ll see</h2><div style="overflow-x:auto"><table class="t"><tbody>${t.table.map(r => `<tr><td class="lbl">${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>`;
    if (t.tells) h += `<h2>At game speed</h2><ul class="tells">${t.tells.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
    if (t.diagrams) h += `<h2>Diagrams</h2><div class="figs">${t.diagrams.map(([k, c]) => `<figure>${SR.drawDiagram(SR.DG[k])}<figcaption>${esc(c)}</figcaption></figure>`).join('')}</div>`;
    if (t.source) h += `<p class="src">Source: <a href="${esc(t.source[1])}" target="_blank" rel="noopener">${esc(t.source[0])}</a></p>`;
    return h + '</article>';
  }
  function viewLearn() {
    const t = SR.LEARN.find(x => x.id === UI.learn) || SR.LEARN[0];
    let toc = '', lastGroup = '';
    for (const x of SR.LEARN) {
      if (x.group !== lastGroup) { toc += `<span class="grp-name">${esc(x.group)}</span>`; lastGroup = x.group; }
      toc += `<button data-act="topic" data-v="${x.id}" aria-current="${x.id === t.id}">${esc(x.title)}</button>`;
    }
    return `<div class="page"><div class="learn"><nav class="toc" aria-label="Topics">${toc}</nav>${topicHTML(t)}</div></div>`;
  }

  // ================================================================ SEASON
  function viewSeason() {
    const my = DB.settings.my;
    const games = DB.games.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.created - a.created);
    const mine = my ? games.filter(g => g.home === my || g.away === my) : [];
    let w = 0, l = 0, t = 0;
    for (const g of mine) {
      if (g.status !== 'final') continue;
      const side = g.home === my ? 'home' : 'away', sc = SR.score(g);
      if (sc[side] > sc[SR.other(side)]) w++; else if (sc[side] < sc[SR.other(side)]) l++; else t++;
    }
    const snaps = allPlays().filter(SR.isSnap).length;
    let h = `<div class="page"><div class="page-h"><h1>Season</h1><span class="sub">${games.length} game${games.length === 1 ? '' : 's'} tracked, ${snaps} snaps logged.</span><span class="top-spacer"></span><button class="btn primary sm" data-act="newgame">New game</button></div>`;
    h += `<div class="grid2"><div class="panel"><h2>Your team</h2>${my ? `<p style="font:700 30px/1.1 var(--font-c)">${esc(SR.teamName(my))} <span class="muted" style="font-size:18px">${esc(my)}</span></p><p class="muted small" style="margin:4px 0 12px">${mine.length} game${mine.length === 1 ? '' : 's'} tracked${w + l + t ? `, ${w}–${l}${t ? '–' + t : ''} in finished games` : ''}.</p>` : '<p class="lede">Pick the team you follow. Its games build your season trends on the Stats tab.</p>'}<button class="btn sm" data-act="sheet" data-v="myteam">${my ? 'Change team' : 'Pick your team'}</button></div>`;
    const last = DB.settings.lastBackup;
    const days = last ? Math.floor((Date.now() - last) / 86400000) : null;
    h += `<div class="panel"><h2>Backup</h2><p class="lede">Everything lives on this iPad. ${last ? `Last backup ${days === 0 ? 'today' : days === 1 ? 'yesterday' : days + ' days ago'}.` : 'No backup yet.'} Save one to Files after each game.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn sm primary" data-act="export">Back up now</button><button class="btn sm" data-act="import">Restore from file</button><button class="btn sm" data-act="csv">Export plays (CSV)</button></div>
      <input type="file" id="importFile" accept="application/json,.json" hidden></div></div>`;
    h += `<div class="panel" style="margin-top:14px"><h2>Games</h2>`;
    if (!games.length) h += '<p class="muted">No games yet. Start one with “New game”.</p>';
    for (const g of games) {
      const sc = SR.score(g);
      const snapsG = g.plays.filter(SR.isSnap).length;
      const isCur = g.id === DB.current;
      const delArmed = UI.confirm === 'del:' + g.id;
      h += `<div class="toggle-row"><div class="tx"><b>${esc(g.week ? g.week + ': ' : '')}${esc(g.away)} ${sc.away} at ${esc(g.home)} ${sc.home}</b><small>${esc(g.date)}, ${g.status === 'final' ? 'final' : 'in progress'}, ${snapsG} snaps${isCur ? ', open now' : ''}</small></div>
        <div style="display:flex;gap:8px">${isCur ? '' : `<button class="btn sm" data-act="opengame" data-v="${g.id}">Open</button>`}<button class="btn sm danger" data-act="delgame" data-v="${g.id}">${delArmed ? 'Tap again to delete' : 'Delete'}</button></div></div>`;
    }
    h += '</div>';
    const s = DB.settings;
    h += `<div class="grid2" style="margin-top:14px"><div class="panel"><h2>Settings</h2>
      <div class="toggle-row"><div class="tx"><b>Theme</b><small>Dark is easier on the eyes next to a TV.</small></div><div class="seg"><button data-act="theme" data-v="auto" aria-pressed="${s.theme === 'auto'}">Auto</button><button data-act="theme" data-v="dark" aria-pressed="${s.theme === 'dark'}">Dark</button><button data-act="theme" data-v="light" aria-pressed="${s.theme === 'light'}">Light</button></div></div>
      <div class="toggle-row"><div class="tx"><b>Keep screen awake</b><small>While the Track tab is open.</small></div><div class="seg"><button data-act="setopt" data-k="wake" data-v="1" aria-pressed="${!!s.wake}">On</button><button data-act="setopt" data-k="wake" data-v="0" aria-pressed="${!s.wake}">Off</button></div></div>
      <div class="toggle-row"><div class="tx"><b>Coaching cues</b><small>“Where to look” text for your focus.</small></div><div class="seg"><button data-act="setopt" data-k="tips" data-v="1" aria-pressed="${!!s.tips}">On</button><button data-act="setopt" data-k="tips" data-v="0" aria-pressed="${!s.tips}">Off</button></div></div>
      </div><div class="panel"><h2>Fields on every snap</h2><p class="lede">These always show on the Track screen. Your focus adds its own fields, and “Show every field” reveals the rest.</p>${chips('core', CONFIGURABLE, s.core, { multi: true, act: 'core' })}</div></div>`;
    h += `<div class="panel" style="margin-top:14px"><h2>About</h2><p class="small muted">Snap Read runs entirely on this device and works offline. Open it from the home-screen icon: home-screen web apps keep their own storage, separate from Safari tabs, so data logged in one won’t appear in the other. Use “Back up now” to keep a copy in Files.</p></div>`;
    return h + '</div>';
  }

  // ================================================================ SHEETS
  const SHEETS = {};
  SHEETS.situation = () => {
    const g = cur(), s = g.sit;
    const sc = SR.score(g);
    const body = `
      <label class="field-label">Offense</label><div class="seg"><button data-act="sit" data-k="off" data-v="away" aria-pressed="${s.off === 'away'}">${esc(g.away)}</button><button data-act="sit" data-k="off" data-v="home" aria-pressed="${s.off === 'home'}">${esc(g.home)}</button></div>
      <label class="field-label">Quarter</label>${chips('q', [['1', 'Q1'], ['2', 'Q2'], ['3', 'Q3'], ['4', 'Q4'], ['5', 'OT']], String(s.q), { act: 'sit' })}
      <label class="field-label">Down</label>${chips('down', [['1', '1st'], ['2', '2nd'], ['3', '3rd'], ['4', '4th']], String(s.down), { act: 'sit', cls: 'fill' })}
      <label class="field-label">To go</label><div class="stepper"><button data-act="sit" data-k="dist" data-v="-1">−1</button><span class="val">${esc(s.spot + s.dist >= 100 ? 'Goal' : s.dist)}</span><button data-act="sit" data-k="dist" data-v="1">+1</button></div>
      <div class="chips" style="margin-top:8px">${[1, 2, 3, 5, 7, 10, 15, 20].map(n => `<button class="chip" data-act="sit" data-k="distset" data-v="${n}">${n}</button>`).join('')}<button class="chip" data-act="sit" data-k="goal">Goal</button></div>
      <label class="field-label">Ball on ${esc(SR.spotText(g, s.off, s.spot))}</label>${s.off ? strip(g, s.off, s.spot, s.dist, 'sit') : ''}
      <div class="stepper" style="margin-top:8px"><button data-act="sit" data-k="spot" data-v="-5">−5</button><button data-act="sit" data-k="spot" data-v="-1">−1</button><span class="val" style="font-size:22px">${esc(SR.spotText(g, s.off, s.spot))}</span><button data-act="sit" data-k="spot" data-v="1">+1</button><button data-act="sit" data-k="spot" data-v="5">+5</button></div>
      <label class="field-label">Score</label>
      ${['away', 'home'].map(side => `<div class="stepper" style="margin-bottom:8px"><button data-act="adj" data-side="${side}" data-v="-1">−1</button><span class="val" style="font-size:22px">${esc(g[side])} ${sc[side]}</span><button data-act="adj" data-side="${side}" data-v="1">+1</button><button data-act="adj" data-side="${side}" data-v="3">+3</button><button data-act="adj" data-side="${side}" data-v="7">+7</button></div>`).join('')}
      <p class="small muted">Score adjustments are for points you didn’t log as plays, like a kick-return touchdown.</p>
      <div class="actions"><button class="btn primary" data-act="close">Done</button></div>`;
    return { title: 'Situation', body };
  };
  SHEETS.drive = (data) => {
    const g = cur(), p = g.sit.pending || {};
    if (data.side === undefined) data.side = p.side || null;
    if (data.spot === undefined) data.spot = p.spot || (p.reason === 'kickoff' || p.reason === 'half' || !p.reason ? (g.lastKick || 30) : 30);
    const title = p.reason === 'half' ? '2nd-half kickoff' : p.reason === 'kickoff' && !g.plays.length ? 'Opening kickoff' : 'New drive';
    let body = `<label class="field-label">${p.reason === 'kickoff' || p.reason === 'half' ? 'Who receives?' : 'Who has the ball?'}</label><div class="seg"><button data-act="dside" data-v="away" aria-pressed="${data.side === 'away'}">${esc(g.away)}</button><button data-act="dside" data-v="home" aria-pressed="${data.side === 'home'}">${esc(g.home)}</button></div>`;
    if (data.side) {
      body += `<label class="field-label">Drive starts at</label><p style="font:700 40px/1 var(--font-c);margin-bottom:10px">${esc(SR.spotText(g, data.side, data.spot))}</p>
        <div class="chips" style="margin-bottom:10px">${[20, 25, 30, 35, 40].map(n => `<button class="chip${data.spot === n ? ' on' : ''}" data-act="dspot" data-v="${n}">Own ${n}</button>`).join('')}</div>
        ${strip(g, data.side, data.spot, 0, 'drive')}
        <div class="stepper" style="margin-top:8px"><button data-act="dstep" data-v="-5">−5</button><button data-act="dstep" data-v="-1">−1</button><button data-act="dstep" data-v="1">+1</button><button data-act="dstep" data-v="5">+5</button></div>`;
    }
    body += `<div class="actions"><button class="btn primary" data-act="dstart"${data.side ? '' : ' disabled'}>Start drive</button></div>`;
    return { title, body };
  };
  SHEETS.pat = () => {
    const g = cur(), p = g.sit.pending;
