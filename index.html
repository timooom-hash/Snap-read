<body>
<div id="app">
  <header id="top"></header>
  <main id="view"></main>
  <nav id="tabs" aria-label="Sections"></nav>
</div>
<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script>
/* Snap Read — engine: data model, situation logic, stats, insights.
   Plain script; exposes window.SR (or global.SR under Node for tests). */
(function (global) {
  'use strict';

  const SR = global.SR = global.SR || {};

  // ---------------------------------------------------------------- teams
  SR.TEAMS = [
    ['ARI', 'Arizona', 'Cardinals'], ['ATL', 'Atlanta', 'Falcons'], ['BAL', 'Baltimore', 'Ravens'],
    ['BUF', 'Buffalo', 'Bills'], ['CAR', 'Carolina', 'Panthers'], ['CHI', 'Chicago', 'Bears'],
    ['CIN', 'Cincinnati', 'Bengals'], ['CLE', 'Cleveland', 'Browns'], ['DAL', 'Dallas', 'Cowboys'],
    ['DEN', 'Denver', 'Broncos'], ['DET', 'Detroit', 'Lions'], ['GB', 'Green Bay', 'Packers'],
    ['HOU', 'Houston', 'Texans'], ['IND', 'Indianapolis', 'Colts'], ['JAX', 'Jacksonville', 'Jaguars'],
    ['KC', 'Kansas City', 'Chiefs'], ['LV', 'Las Vegas', 'Raiders'], ['LAC', 'LA', 'Chargers'],
    ['LAR', 'LA', 'Rams'], ['MIA', 'Miami', 'Dolphins'], ['MIN', 'Minnesota', 'Vikings'],
    ['NE', 'New England', 'Patriots'], ['NO', 'New Orleans', 'Saints'], ['NYG', 'New York', 'Giants'],
    ['NYJ', 'New York', 'Jets'], ['PHI', 'Philadelphia', 'Eagles'], ['PIT', 'Pittsburgh', 'Steelers'],
    ['SF', 'San Francisco', '49ers'], ['SEA', 'Seattle', 'Seahawks'], ['TB', 'Tampa Bay', 'Buccaneers'],
    ['TEN', 'Tennessee', 'Titans'], ['WAS', 'Washington', 'Commanders']
  ];
  SR.teamName = function (abbr) {
    const t = SR.TEAMS.find(x => x[0] === abbr);
    return t ? t[2] : (abbr || '');
  };

  // ---------------------------------------------------------------- options
  // [value, label]
  SR.OPT = {
    pred: [['run', 'Run'], ['pass', 'Pass']],
    pers: [['11', '11'], ['12', '12'], ['13', '13'], ['21', '21'], ['22', '22'], ['10', '10'], ['20', '20'], ['jumbo', 'Jumbo'], ['oth', 'Other']],
    qb: [['gun', 'Shotgun'], ['uc', 'Under center'], ['pistol', 'Pistol']],
    set: [['2x2', '2×2'], ['3x1', '3×1 trips'], ['empty', 'Empty'], ['bunch', 'Bunch / stack'], ['tight', 'Compressed'], ['2back', '2-back'], ['oth', 'Other']],
    motion: [['none', 'None'], ['jet', 'Jet'], ['orbit', 'Orbit'], ['across', 'Across'], ['shift', 'Shift'], ['return', 'Return'], ['oth', 'Other']],
    mread: [['man', 'Defender travelled'], ['zone', 'Defense bumped'], ['unclear', 'Couldn’t tell']],
    dpers: [['base', 'Base (4 DB)'], ['nickel', 'Nickel (5 DB)'], ['dime', 'Dime (6+ DB)'], ['goal', 'Goal line']],
    box: [['5', '5 or less'], ['6', '6'], ['7', '7'], ['8', '8+']],
    shell: [['0', '0-high'], ['1', '1-high'], ['2', '2-high']],
    type: [['run', 'Run'], ['pass', 'Pass'], ['sack', 'Sack'], ['scramble', 'Scramble']],
    special: [['punt', 'Punt'], ['fg', 'Field goal'], ['kneel', 'Kneel'], ['spike', 'Spike'], ['nop', 'Penalty, no play']],
    lane: [['LE', 'Outside left'], ['LI', 'Inside left'], ['M', 'Middle'], ['RI', 'Inside right'], ['RE', 'Outside right']],
    rc: [['iz', 'Inside zone'], ['oz', 'Outside zone'], ['duo', 'Duo'], ['power', 'Power'], ['counter', 'Counter'], ['trap', 'Trap'], ['draw', 'Draw'], ['toss', 'Toss / sweep'], ['qb', 'QB run'], ['option', 'Option'], ['oth', 'Other']],
    pt: [['quick', 'Quick game'], ['drop', 'Dropback'], ['pa', 'Play-action'], ['boot', 'Boot / rollout'], ['screen', 'Screen'], ['rpo', 'RPO']],
    pr: [['comp', 'Complete'], ['inc', 'Incomplete'], ['int', 'Intercepted']],
    depth: [['dp', 'Deep', '20+'], ['in', 'Middle', '10–19'], ['sh', 'Short', '0–9'], ['bl', 'Behind', 'LOS']],
    dir: [['L', 'Left'], ['M', 'Middle'], ['R', 'Right']],
    pres: [['clean', 'Clean pocket'], ['press', 'Pressured'], ['hit', 'QB hit']],
    rush: [['3', '3'], ['4', '4'], ['5', '5'], ['6', '6+']],
    rushx: [['lb', 'LB blitz'], ['db', 'DB blitz'], ['sim', 'Sim pressure'], ['stunt', 'Stunt']],
    covf: [['man', 'Man'], ['zone', 'Zone']],
    cov: [['c0', 'Cover 0'], ['c1', 'Cover 1'], ['c2', 'Cover 2'], ['c3', 'Cover 3'], ['c4', 'Cover 4'], ['c6', 'Cover 6'], ['2m', '2-Man']],
    tags: [['nohuddle', 'No-huddle'], ['2min', '2-minute'], ['4min', 'Clock-killing'], ['trick', 'Trick play'], ['audible', 'Audible']]
  };
  SR.COV_FAMILY = { c0: 'man', c1: 'man', '2m': 'man', c2: 'zone', c3: 'zone', c4: 'zone', c6: 'zone' };
  SR.COV_HIGH = { c0: 0, c1: 1, c3: 1, c2: 2, c4: 2, c6: 2, '2m': 2 };
  SR.label = function (key, val) {
    const o = SR.OPT[key];
    if (!o) return String(val);
    const f = o.find(x => x[0] === String(val));
    return f ? f[1] : String(val);
  };

  SR.BUCKETS = [
    ['1st', '1st down'], ['2nd-short', '2nd & 1–3'], ['2nd-med', '2nd & 4–6'], ['2nd-long', '2nd & 7+'],
    ['3rd-short', '3rd & 1–3'], ['3rd-med', '3rd & 4–6'], ['3rd-long', '3rd & 7+'], ['4th', '4th down']
  ];

  // ---------------------------------------------------------------- utils
  const uid = SR.uid = function () {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  SR.clamp = clamp;
  const other = SR.other = side => (side === 'home' ? 'away' : 'home');
  const pct = SR.pct = (k, n) => (n ? Math.round((100 * k) / n) : 0);
  const r1 = SR.r1 = v => (Math.round(v * 10) / 10);
  const d1 = SR.d1 = v => (Math.round(v * 10) / 10).toFixed(1);

  SR.ordinal = function (d) { return ['', '1st', '2nd', '3rd', '4th'][d] || ''; };

  // Ball spot: yards from the offense's own goal line (1..99)
  SR.spotText = function (game, offSide, spot) {
    if (spot === 50) return 'Midfield';
    const own = spot < 50;
    const team = own ? game[offSide] : game[other(offSide)];
    return team + ' ' + (own ? spot : 100 - spot);
  };
  SR.ddText = function (down, dist, spot) {
    if (!down) return '';
    const goal = spot + dist >= 100;
    return SR.ordinal(down) + ' & ' + (goal ? 'Goal' : dist);
  };

  // ---------------------------------------------------------------- game model
  SR.newGame = function ({ home, away, my, week, date }) {
    const now = Date.now();
    return {
      id: uid(), v: 1, created: now, updated: now,
      home, away, my: my || null, week: week || '', date: date || new Date().toISOString().slice(0, 10),
      plays: [],
      sit: { q: 1, off: null, down: 1, dist: 10, spot: 25, drive: 0, pending: { kind: 'drive', side: null, reason: 'kickoff' } },
      adj: { home: 0, away: 0 },
      draft: {},
      focus: 'auto',
      status: 'live'
    };
  };

  SR.mySide = function (game) {
    if (!game) return null;
    if (game.my && game.home === game.my) return 'home';
    if (game.my && game.away === game.my) return 'away';
    return null;
  };

  // ---------------------------------------------------------------- outcome of one play
  const SCRIM = new Set(['run', 'pass', 'sack', 'scramble']);
  SR.isSnap = p => SCRIM.has(p.type) && !(p.pen && p.pen.noPlay);
  SR.isDropback = p => p.type === 'pass' || p.type === 'sack' || p.type === 'scramble';
  SR.isRun = p => p.type === 'run';

  function penaltyShift(pen, spotAfter) {
    // returns signed yards for the offense, with half-the-distance enforcement
    if (!pen || !pen.yds) return 0;
    let y = Math.abs(pen.yds);
    if (pen.on === 'def') {
      const room = 100 - spotAfter;
      if (y > room / 2) y = Math.max(1, Math.floor(room / 2));
      return y;
    }
    if (y > spotAfter / 2) y = Math.max(1, Math.floor(spotAfter / 2));
    return -y;
  }

  // Everything derivable about a play from what was logged.
  SR.outcome = function (p) {
    const o = { gain: 0, fd: false, td: false, defTD: false, safety: false, turnover: null, newSpot: p.spot, penY: 0, noPlay: false };
    const noPlay = !!(p.pen && p.pen.noPlay) || p.type === 'nop';
    o.noPlay = noPlay;

    if (!noPlay) {
      if (p.type === 'run' || p.type === 'scramble' || p.type === 'sack' || p.type === 'kneel') o.gain = toInt(p.yds);
      else if (p.type === 'pass') o.gain = p.pr === 'comp' ? toInt(p.yds) : 0;
      else o.gain = 0;
      if (p.type === 'sack' && o.gain > 0) o.gain = -o.gain;
    }

    const spotAfterPlay = p.spot + o.gain;
    o.penY = penaltyShift(p.pen, noPlay ? p.spot : spotAfterPlay);
    o.newSpot = spotAfterPlay + o.penY;

    if (p.type === 'punt') { o.turnover = 'punt'; return o; }
    if (p.type === 'fg') { if (!p.fgGood) o.turnover = 'fgmiss'; return o; }
    if (!noPlay) {
      if (p.pr === 'int' && p.type === 'pass') o.turnover = 'int';
      if (p.fum) o.turnover = 'fum';
    }
    if (o.turnover === 'int' || o.turnover === 'fum') {
      if (p.rtd) o.defTD = true;
      return o;
    }
    if (!noPlay && spotAfterPlay >= 100) { o.td = true; o.newSpot = 100; o.fd = true; return o; }
    if (!noPlay && spotAfterPlay <= 0) { o.safety = true; return o; }

    const advance = o.newSpot - p.spot;
    if (p.pen && p.pen.on === 'def' && p.pen.auto1st) o.fd = true;
    if (p.down && advance >= p.dist) o.fd = true;
    if (o.newSpot >= 100) { o.newSpot = 99; }
    if (o.newSpot <= 0) { o.newSpot = 1; }
    if (p.down === 4 && !o.fd && !o.td && p.type !== 'kneel' && !(noPlay && !(p.pen && p.pen.lossDown))) {
      o.turnover = 'downs';
    }
    if (p.down === 4 && p.type === 'kneel' && !o.fd) o.turnover = 'downs';
    return o;
  };

  function toInt(v) {
    const n = parseInt(v, 10);
    return isNaN(n) ? 0 : n;
  }

  // ---------------------------------------------------------------- score
  SR.score = function (game, uptoExclusive) {
    const s = { home: (game.adj && game.adj.home) || 0, away: (game.adj && game.adj.away) || 0 };
    const list = uptoExclusive == null ? game.plays : game.plays.slice(0, uptoExclusive);
    for (const p of list) {
      const o = SR.outcome(p);
      const off = p.off, def = other(off);
      if (o.td) s[off] += 6;
      if (o.defTD) s[def] += 6;
      if (p.pat && (o.td || o.defTD)) {
        const scorer = o.defTD ? def : off;
        s[scorer] += p.pat === 'xp' ? 1 : p.pat === '2pt' ? 2 : 0;
      }
      if (p.type === 'fg' && p.fgGood) s[off] += 3;
      if (o.safety) s[def] += 2;
    }
    return s;
  };

  // ---------------------------------------------------------------- situation advance
  // Given the situation a play was snapped in, return the next situation.
  SR.nextSituation = function (game, p) {
    const o = SR.outcome(p);
    const sit = { q: p.q, off: p.off, down: p.down, dist: p.dist, spot: p.spot, drive: p.drive, pending: null };
    const def = other(p.off);

    if (o.td) { sit.pending = { kind: 'pat', side: p.off, playId: p.id }; return sit; }
    if (o.defTD) { sit.pending = { kind: 'pat', side: def, playId: p.id }; return sit; }
    if (o.safety) { sit.pending = { kind: 'drive', side: def, reason: 'safety' }; return sit; }
    if (p.type === 'fg' && p.fgGood) { sit.pending = { kind: 'drive', side: def, reason: 'kickoff' }; return sit; }
    if (o.turnover) {
      let guess;
      if (o.turnover === 'punt') guess = clamp(100 - (p.spot + 40), 1, 99);
      else if (o.turnover === 'fgmiss') guess = clamp(100 - Math.max(p.spot - 7, 20), 1, 99);
      else guess = clamp(100 - o.newSpot, 1, 99);
      sit.pending = { kind: 'drive', side: def, reason: o.turnover, spot: guess };
      return sit;
    }

    sit.spot = o.newSpot;
    if (o.fd) {
      sit.down = 1;
      sit.dist = Math.min(10, 100 - sit.spot);
      return sit;
    }
    const advance = o.newSpot - p.spot;
    if (o.noPlay) {
      // penalty, down is replayed unless loss of down
      sit.down = p.down + (p.pen && p.pen.lossDown ? 1 : 0);
      sit.dist = Math.max(1, p.dist - advance);
    } else {
      sit.down = p.down + 1;
      sit.dist = Math.max(1, p.dist - advance);
      if (p.pen && p.pen.on === 'off' && p.pen.lossDown) { /* already advancing */ }
    }
    if (sit.down > 4) sit.down = 4;
    if (sit.spot + sit.dist > 100) sit.dist = 100 - sit.spot;
    return sit;
  };

  // Start a new drive (after kickoff, punt, turnover...)
  SR.startDrive = function (game, side, spot) {
    const s = game.sit;
    s.off = side;
    s.down = 1;
    s.spot = clamp(Math.round(spot), 1, 99);
    s.dist = Math.min(10, 100 - s.spot);
    s.drive = (maxDrive(game) || 0) + 1;
    s.pending = null;
  };
  function maxDrive(game) {
    let m = game.sit.drive || 0;
    for (const p of game.plays) if (p.drive > m) m = p.drive;
    return m;
  }

  SR.logPlay = function (game, fields) {
    const s = game.sit;
    const p = Object.assign({
      id: uid(), t: Date.now(), q: s.q, off: s.off, down: s.down, dist: s.dist, spot: s.spot, drive: s.drive
    }, cleanFields(fields));
    game.plays.push(p);
    game.sit = SR.nextSituation(game, p);
    game.updated = Date.now();
    return p;
  };

  function cleanFields(f) {
    const out = {};
    for (const k in f) {
      const v = f[k];
      if (v === null || v === undefined || v === '') continue;
      if (Array.isArray(v) && !v.length) continue;
      out[k] = v;
    }
    return out;
  }
  SR.cleanFields = cleanFields;

  SR.undoLast = function (game) {
    const p = game.plays.pop();
    if (!p) return null;
    game.sit = { q: p.q, off: p.off, down: p.down, dist: p.dist, spot: p.spot, drive: p.drive, pending: null };
    game.updated = Date.now();
    return p;
  };

  SR.setQuarter = function (game, q) {
    const prev = game.sit.q;
    game.sit.q = q;
    if (prev <= 2 && q >= 3) {
      // new half: possession decided by the second-half kickoff
      game.sit.pending = { kind: 'drive', side: game.sit.off ? other(game.sit.off) : null, reason: 'half' };
    }
  };

  // ---------------------------------------------------------------- drives
  SR.drives = function (game) {
    const map = new Map();
    game.plays.forEach((p, i) => {
      if (!map.has(p.drive)) map.set(p.drive, { n: p.drive, off: p.off, start: p.spot, q: p.q, plays: [], idx: [] });
      const d = map.get(p.drive);
      d.plays.push(p); d.idx.push(i);
    });
    const list = Array.from(map.values()).sort((a, b) => a.n - b.n);
        for (const d of list) {
      const last = d.plays[d.plays.length - 1];
      const o = SR.outcome(last);
      let yards = 0, snaps = 0;
      for (const p of d.plays) {
        const oo = SR.outcome(p);
        if (p.type !== 'punt' && p.type !== 'fg') yards += oo.gain + oo.penY;
        if (SR.isSnap(p)) snaps++;
      }
      d.yards = yards;
      d.snaps = snaps;
      d.maxSpot = Math.max(...d.plays.map(p => p.spot));
      d.result = o.td ? 'TD' : o.defTD ? (last.pr === 'int' ? 'Pick-six' : 'Defensive TD') : o.safety ? 'Safety'
        : last.type === 'fg' ? (last.fgGood ? 'FG' : 'Missed FG') : o.turnover === 'punt' ? 'Punt'
          : o.turnover === 'int' ? 'Interception' : o.turnover === 'fum' ? 'Fumble' : o.turnover === 'downs' ? 'Downs'
            : null;
      if (!d.result) {
        const lastOfDrive = d.idx[d.idx.length - 1];
        const next = game.plays[lastOfDrive + 1];
        if (!next) d.result = game.status === 'final' ? 'End of game' : (game.sit.drive === d.n && !game.sit.pending ? 'In progress' : (game.sit.q >= 3 && last.q <= 2 ? 'End of half' : '—'));
        else if (next.q >= 3 && last.q <= 2) d.result = 'End of half';
        else d.result = '—';
      }
      d.points = d.result === 'TD' ? 6 + (last.pat === 'xp' ? 1 : last.pat === '2pt' ? 2 : 0) : d.result === 'FG' ? 3 : 0;
      d.redZone = d.maxSpot >= 80;
    }
    return list;
  };

  // ---------------------------------------------------------------- enrichment for stats
  // Plays carry side keys; stats need team abbreviations and derived outcome.
  SR.enrich = function (game) {
    return game.plays.map((p, i) => Object.assign({}, p, {
      offT: game[p.off], defT: game[other(p.off)], gid: game.id, week: game.week, date: game.date, idx: i,
      half: p.q <= 2 ? 1 : 2, o: SR.outcome(p)
    }));
  };

  SR.bucket = function (p) {
    if (p.down === 1) return '1st';
    if (p.down === 4) return '4th';
    const s = p.dist <= 3 ? 'short' : p.dist <= 6 ? 'med' : 'long';
    return (p.down === 2 ? '2nd-' : '3rd-') + s;
  };

  SR.success = function (p) {
    const o = p.o || SR.outcome(p);
    if (o.turnover === 'int' || o.turnover === 'fum') return false;
    if (o.td) return true;
    const g = o.gain;
    if (p.down === 1) return g >= 0.4 * p.dist;
    if (p.down === 2) return g >= 0.6 * p.dist;
    return g >= p.dist;
  };
  SR.explosive = function (p) {
    const o = p.o || SR.outcome(p);
    if (p.type === 'pass') return p.pr === 'comp' && o.gain >= 20;
    if (p.type === 'run' || p.type === 'scramble') return o.gain >= 10;
    return false;
  };
  SR.isPassOutcome = p => SR.isDropback(p);

  function agg(list) {
    const a = { n: list.length, runs: 0, db: 0, succ: 0, yds: 0, expl: 0, fd: 0, to: 0 };
    for (const p of list) {
      if (SR.isRun(p)) a.runs++; else if (SR.isDropback(p)) a.db++;
      if (SR.success(p)) a.succ++;
      a.yds += p.o.gain;
      if (SR.explosive(p)) a.expl++;
      if (p.o.fd) a.fd++;
      if (p.o.turnover === 'int' || p.o.turnover === 'fum') a.to++;
    }
    a.passRate = a.n ? a.db / a.n : 0;
    a.sr = a.n ? a.succ / a.n : 0;
    a.ypp = a.n ? a.yds / a.n : 0;
    return a;
  }
  SR.agg = agg;

  function groupBy(list, keyFn, order) {
    const m = new Map();
    for (const p of list) {
      const k = keyFn(p);
      if (k === undefined || k === null || k === '') continue;
      if (!m.has(k)) m.set(k, []);
      m.get(k).push(p);
    }
    const keys = order ? order.map(x => x[0]).filter(k => m.has(k)) : Array.from(m.keys());
    if (order) for (const k of m.keys()) if (!keys.includes(k)) keys.push(k);
    return keys.map(k => ({ key: k, label: order ? (order.find(x => x[0] === k) || [k, k])[1] : k, plays: m.get(k), a: agg(m.get(k)) }));
  }
  SR.groupBy = groupBy;

  const known = (list, f) => list.filter(p => p[f] !== undefined && p[f] !== null && p[f] !== '');

  // ---------------------------------------------------------------- offense report
  SR.offense = function (plays) {
    const snaps = plays.filter(SR.isSnap);
    const runs = snaps.filter(SR.isRun);
    const dbs = snaps.filter(SR.isDropback);
    const atts = snaps.filter(p => p.type === 'pass');
    const comps = atts.filter(p => p.pr === 'comp');
    const R = { n: snaps.length, all: agg(snaps) };
    R.early = agg(snaps.filter(p => p.down === 1 || p.down === 2));
    R.byBucket = groupBy(snaps, SR.bucket, SR.BUCKETS);
    R.byPers = groupBy(snaps, p => p.pers, SR.OPT.pers);
    R.byQb = groupBy(snaps, p => p.qb, SR.OPT.qb);
    R.bySet = groupBy(snaps, p => p.set, SR.OPT.set);
    const mk = known(snaps, 'motion');
    const withM = mk.filter(p => p.motion !== 'none');
    R.motion = {
      known: mk.length, yes: withM.length, rate: mk.length ? withM.length / mk.length : 0,
      withA: agg(withM), withoutA: agg(mk.filter(p => p.motion === 'none')),
      byType: groupBy(withM, p => p.motion, SR.OPT.motion),
      read: groupBy(known(withM, 'mread'), p => p.mread, SR.OPT.mread)
    };
    R.run = {
      a: agg(runs), ypc: runs.length ? agg(runs).yds / runs.length : 0,
      byLane: groupBy(runs, p => p.lane, SR.OPT.lane),
      bySide: groupBy(runs, p => p.lane ? (p.lane[0] === 'L' ? 'L' : p.lane[0] === 'R' ? 'R' : 'M') : null, [['L', 'Left'], ['M', 'Middle'], ['R', 'Right']]),
      byConcept: groupBy(runs, p => p.rc, SR.OPT.rc),
      byBox: groupBy(runs, p => p.box ? (+p.box <= 6 ? 'light' : +p.box === 7 ? 'neutral' : 'heavy') : null, [['light', '6 or fewer'], ['neutral', '7'], ['heavy', '8+']])
    };
    const passYds = comps.reduce((s, p) => s + p.o.gain, 0);
    const sacks = dbs.filter(p => p.type === 'sack');
    const presKnown = dbs.filter(p => p.type === 'sack' || p.pres);
    const pressured = presKnown.filter(p => p.type === 'sack' || p.pres === 'press' || p.pres === 'hit');
    R.pass = {
      a: agg(dbs), att: atts.length, comp: comps.length, yds: passYds,
      ypa: atts.length ? passYds / atts.length : 0,
      ypd: dbs.length ? dbs.reduce((s, p) => s + p.o.gain, 0) / dbs.length : 0,
      ints: atts.filter(p => p.pr === 'int').length,
      sacks: sacks.length, scr: dbs.filter(p => p.type === 'scramble').length,
      presKnown: presKnown.length, pressured: pressured.length,
      byType: groupBy(atts, p => p.pt, SR.OPT.pt),
      paAgg: agg(atts.filter(p => p.pt === 'pa')), nonPaAgg: agg(atts.filter(p => p.pt && p.pt !== 'pa')),
      grid: passGrid(atts)
    };
    const thirds = snaps.filter(p => p.down === 3);
    const fourths = snaps.filter(p => p.down === 4);
    R.third = { att: thirds.length, conv: thirds.filter(p => p.o.fd).length };
    R.fourth = { att: fourths.length, conv: fourths.filter(p => p.o.fd).length };
    R.explosives = snaps.filter(SR.explosive);
    R.turnovers = plays.filter(p => p.o.turnover === 'int' || p.o.turnover === 'fum').length;
    R.knownRate = {};
    for (const f of ['pers', 'qb', 'set', 'motion', 'lane', 'rc', 'pt']) {
      const base = f === 'lane' || f === 'rc' ? runs : f === 'pt' ? atts : snaps;
      R.knownRate[f] = { k: known(base, f).length, n: base.length };
    }
    return R;
  };

  function passGrid(atts) {
    const g = {};
    for (const d of SR.OPT.depth) for (const x of SR.OPT.dir) g[d[0] + x[0]] = { att: 0, comp: 0, yds: 0, int: 0 };
    let charted = 0;
    for (const p of atts) {
      if (!p.depth || !p.dir) continue;
      const c = g[p.depth + p.dir];
      if (!c) continue;
      charted++;
      c.att++;
      if (p.pr === 'comp') { c.comp++; c.yds += p.o.gain; }
      if (p.pr === 'int') c.int++;
    }
    g.charted = charted;
    return g;
  }

  // ---------------------------------------------------------------- defense report
  SR.defense = function (plays) {
    const snaps = plays.filter(SR.isSnap);
    const dbs = snaps.filter(SR.isDropback);
    const runs = snaps.filter(SR.isRun);
    const R = { n: snaps.length, all: agg(snaps) };
    const rk = known(snaps, 'rush');
    const blitz = rk.filter(p => +p.rush >= 5);
    const four = rk.filter(p => +p.rush <= 4);
    R.rush = {
      known: rk.length, blitz: blitz.length, rate: rk.length ? blitz.length / rk.length : 0,
      dist: groupBy(rk, p => p.rush, SR.OPT.rush),
      blitzA: agg(blitz), fourA: agg(four),
      byBucket: SR.BUCKETS.map(b => {
        const l = rk.filter(p => SR.bucket(p) === b[0]);
        return { key: b[0], label: b[1], n: l.length, k: l.filter(p => +p.rush >= 5).length };
      }).filter(x => x.n),
      extras: groupBy(snaps.filter(p => p.rushx && p.rushx.length).flatMap(p => p.rushx.map(x => Object.assign({}, p, { _rx: x }))), p => p._rx, SR.OPT.rushx)
    };
    const presKnown = dbs.filter(p => p.type === 'sack' || p.pres);
    R.pressure = {
      known: presKnown.length,
      k: presKnown.filter(p => p.type === 'sack' || p.pres === 'press' || p.pres === 'hit').length,
      sacks: dbs.filter(p => p.type === 'sack').length
    };
    const sk = known(snaps, 'shell');
    R.shell = {
      known: sk.length,
      dist: groupBy(sk, p => p.shell, SR.OPT.shell),
      byBucket: SR.BUCKETS.map(b => {
        const l = sk.filter(p => SR.bucket(p) === b[0]);
        return { key: b[0], label: b[1], n: l.length, two: l.filter(p => p.shell === '2').length, one: l.filter(p => p.shell === '1').length, zero: l.filter(p => p.shell === '0').length };
      }).filter(x => x.n),
      byPers: groupBy(known(sk, 'pers'), p => p.pers, SR.OPT.pers).map(g => ({ key: g.key, label: g.label, n: g.plays.length, two: g.plays.filter(p => p.shell === '2').length }))
    };
    // rotation: pre-snap shell vs post-snap coverage
    const both = snaps.filter(p => p.shell && p.cov);
    const rotated = both.filter(p => SR.COV_HIGH[p.cov] !== undefined && SR.COV_HIGH[p.cov] !== +p.shell);
    R.rotation = { n: both.length, k: rotated.length };
    const ck = snaps.filter(p => p.covf || p.cov).map(p => Object.assign({}, p, { _cf: p.cov ? SR.COV_FAMILY[p.cov] : p.covf }));
    R.cov = {
      known: ck.length,
      fam: groupBy(ck, p => p._cf, SR.OPT.covf),
      type: groupBy(known(snaps, 'cov'), p => p.cov, SR.OPT.cov)
    };
    R.box = { known: known(snaps, 'box').length, dist: groupBy(known(snaps, 'box'), p => p.box, SR.OPT.box), runs: groupBy(runs, p => p.box ? (+p.box <= 6 ? 'light' : +p.box === 7 ? 'neutral' : 'heavy') : null, [['light', '6 or fewer'], ['neutral', '7'], ['heavy', '8+']]) };
    R.dpers = { known: known(snaps, 'dpers').length, dist: groupBy(known(snaps, 'dpers'), p => p.dpers, SR.OPT.dpers) };
    R.match = groupBy(snaps.filter(p => p.pers && p.dpers), p => p.pers, SR.OPT.pers).map(g => ({
      key: g.key, label: g.label, n: g.plays.length, d: groupBy(g.plays, p => p.dpers, SR.OPT.dpers).map(x => ({ key: x.key, label: x.label, n: x.plays.length }))
    }));
    const mot = snaps.filter(p => p.motion && p.motion !== 'none' && p.mread && p.mread !== 'unclear');
    R.motionRead = { n: mot.length, man: mot.filter(p => p.mread === 'man').length };
    const thirds = snaps.filter(p => p.down === 3);
    R.third = { att: thirds.length, stops: thirds.filter(p => !p.o.fd).length };
    R.explosives = snaps.filter(SR.explosive);
    R.takeaways = plays.filter(p => p.o.turnover === 'int' || p.o.turnover === 'fum').length;
    const atts = snaps.filter(p => p.type === 'pass');
    R.covYpa = ['man', 'zone'].map(f => {
      const l = atts.filter(p => (p.cov ? SR.COV_FAMILY[p.cov] : p.covf) === f);
      const y = l.reduce((s, p) => s + p.o.gain, 0);
      return { key: f, n: l.length, ypa: l.length ? y / l.length : 0 };
    });
    R.knownRate = {};
    for (const f of ['shell', 'rush', 'box', 'dpers']) R.knownRate[f] = { k: known(snaps, f).length, n: snaps.length };
    R.knownRate.cov = { k: ck.length, n: snaps.length };
    return R;
  };

  // ---------------------------------------------------------------- insights
  // Each insight: { text, n, s (strength), kind }
  const MIN_N = 4;
  function lean(k, n) { return n ? Math.abs(k / n - 0.5) * 2 : 0; }
  function strength(k, n) { return lean(k, n) * Math.sqrt(n); }

  SR.offenseInsights = function (R, T) {
    const out = [];
    const tell = (groups, ctxFn) => {
      for (const g of groups) {
        const n = g.a.n, k = g.a.db;
        if (n < MIN_N) continue;
        const rate = k / n;
        if (rate >= 0.75 || rate <= 0.25) {
          const pass = rate >= 0.5, ctx = ctxFn(g), kk = pass ? k : n - k;
          out.push({ kind: 'tell', n, k: kk, pass, ctx, s: strength(k, n) + 0.3, text: `${ctx.charAt(0).toUpperCase() + ctx.slice(1)}: ${pass ? 'pass' : 'run'} ${kk} of ${n}`, key: g.key });
        }
      }
    };
    tell(R.byPers, g => `from ${g.label === 'Jumbo' || g.label === 'Other' ? g.label.toLowerCase() : g.label} personnel`);
    tell(R.byQb, g => `from ${g.label.toLowerCase()}`);
    tell(R.bySet, g => `from ${g.label.toLowerCase()}`);
    for (const g of R.byBucket) {
      if (g.a.n < 3) continue;
      const k = g.a.db, n = g.a.n;
      if (k / n >= 0.8 || k / n <= 0.2) {
        const pass = k / n >= 0.5;
        out.push({ kind: 'situation', n, s: strength(k, n) + 0.1, text: `On ${g.label}: ${pass ? 'pass' : 'run'} ${pass ? k : n - k} of ${n}` });
      }
    }
    if (R.early.n >= 8) {
      out.push({ kind: 'mix', n: R.early.n, s: lean(R.early.db, R.early.n) * Math.sqrt(R.early.n) * 0.8, text: `Early downs: pass ${R.early.db} of ${R.early.n} (${pct(R.early.db, R.early.n)}%)` });
    }
    const m = R.motion;
    if (m.known >= 8) {
      out.push({ kind: 'motion', n: m.known, s: lean(m.yes, m.known) * Math.sqrt(m.known) * 0.7, text: `Motion on ${m.yes} of ${m.known} snaps` });
      if (m.withA.n >= 4 && m.withoutA.n >= 4) {
        const d = m.withA.sr - m.withoutA.sr;
        if (Math.abs(d) >= 0.2) {
          out.push({ kind: 'motion', n: m.known, s: Math.abs(d) * Math.sqrt(m.known), text: `${d > 0 ? 'Better' : 'Worse'} with motion: ${m.withA.succ} of ${m.withA.n} successful vs ${m.withoutA.succ} of ${m.withoutA.n} without` });
        }
      }
    }
    // run lanes
    const lanes = R.run.bySide.filter(g => g.a.n >= 3);
    if (lanes.length >= 2) {
      const sorted = lanes.slice().sort((a, b) => b.a.ypp - a.a.ypp);
      const best = sorted[0], worst = sorted[sorted.length - 1];
      if (best.a.ypp - worst.a.ypp >= 2.5) {
        out.push({ kind: 'run', n: best.a.n + worst.a.n, s: Math.min(3, (best.a.ypp - worst.a.ypp) / 2) * Math.sqrt(best.a.n + worst.a.n) * 0.5, text: `Runs ${best.label.toLowerCase()}: ${d1(best.a.ypp)} per carry (${best.a.n} carries); ${worst.label.toLowerCase()}: ${d1(worst.a.ypp)} (${worst.a.n})` });
      }
    }
    const runN = R.run.a.n;
    for (const g of R.run.byConcept) {
      if (g.a.n >= 3 && runN >= 5 && g.a.n / runN >= 0.4) {
        out.push({ kind: 'run', n: runN, s: (g.a.n / runN) * Math.sqrt(runN) * 0.8, text: `Favorite run: ${g.label.toLowerCase()}, ${g.a.n} of ${runN} (${d1(g.a.ypp)} per carry)` });
      }
    }
    if (R.run.a.n >= 6 && R.pass.a.n >= 6) {
      const d = R.run.a.sr - R.pass.a.sr;
      if (Math.abs(d) >= 0.2) {
        const better = d > 0 ? ['Runs', R.run.a, 'passes', R.pass.a] : ['Passes', R.pass.a, 'runs', R.run.a];
        out.push({ kind: 'efficiency', n: R.n, s: Math.abs(d) * Math.sqrt(R.n) * 0.8, text: `${better[0]} are working: ${better[1].succ} of ${better[1].n} successful; ${better[2]} ${better[3].succ} of ${better[3].n}` });
      }
    }
    const pa = R.pass.paAgg, npa = R.pass.nonPaAgg;
    if (pa.n >= 3 && npa.n >= 3) {
      const d = pa.ypp - npa.ypp;
      if (Math.abs(d) >= 3) out.push({ kind: 'pass', n: pa.n + npa.n, s: Math.min(3, Math.abs(d) / 3) * Math.sqrt(pa.n + npa.n) * 0.5, text: `Play-action: ${d1(pa.ypp)} yds per attempt (${pa.n}) vs ${d1(npa.ypp)} without (${npa.n})` });
    }
    // pass direction/depth concentration
    const g = R.pass.grid;
    if (g.charted >= 6) {
      const deep = ['dpL', 'dpM', 'dpR'].reduce((s, k) => s + g[k].att, 0);
      const deepC = ['dpL', 'dpM', 'dpR'].reduce((s, k) => s + g[k].comp, 0);
      if (deep >= 3) out.push({ kind: 'pass', n: g.charted, s: 0.9, text: `Deep shots: ${deepC} of ${deep} completed` });
      const short = ['shL', 'shM', 'shR', 'blL', 'blM', 'blR'].reduce((s, k) => s + g[k].att, 0);
      if (short / g.charted >= 0.75) out.push({ kind: 'pass', n: g.charted, s: (short / g.charted) * Math.sqrt(g.charted) * 0.6, text: `Throwing short: ${short} of ${g.charted} charted throws under 10 yards` });
      const sides = ['L', 'M', 'R'].map(x => ({ x, n: ['dp', 'in', 'sh', 'bl'].reduce((s, d) => s + g[d + x].att, 0) }));
      const top = sides.sort((a, b) => b.n - a.n)[0];
      if (top.n / g.charted >= 0.6 && top.x !== 'M') out.push({ kind: 'pass', n: g.charted, s: (top.n / g.charted) * Math.sqrt(g.charted) * 0.5, text: `Targets lean ${top.x === 'L' ? 'left' : 'right'}: ${top.n} of ${g.charted} charted throws` });
    }
    if (R.third.att >= 3) out.push({ kind: 'third', n: R.third.att, s: lean(R.third.conv, R.third.att) * Math.sqrt(R.third.att) * 0.6 + 0.2, text: `3rd downs: converted ${R.third.conv} of ${R.third.att}` });
    if (R.explosives.length >= 2) {
      const ep = R.explosives.filter(p => p.type === 'pass').length;
      out.push({ kind: 'explosive', n: R.n, s: 0.4 + R.explosives.length * 0.15, text: `${R.explosives.length} explosive plays (${ep} pass, ${R.explosives.length - ep} run)` });
    }
    out.sort((a, b) => b.s - a.s);
    return dedupe(out);
  };

  SR.defenseInsights = function (R) {
    const out = [];
    const rr = R.rush;
    if (rr.known >= 6) {
      out.push({ kind: 'blitz', n: rr.known, s: lean(rr.blitz, rr.known) * Math.sqrt(rr.known) * 0.8 + 0.2, text: `Blitzed (5+ rushers) on ${rr.blitz} of ${rr.known} snaps` });
    }
    const third = rr.byBucket.filter(b => b.key.startsWith('3rd'));
    const tn = third.reduce((s, b) => s + b.n, 0), tk = third.reduce((s, b) => s + b.k, 0);
    if (tn >= 3 && (tk / tn >= 0.6 || (tk === 0 && tn >= 4))) out.push({ kind: 'blitz', n: tn, s: lean(tk, tn) * Math.sqrt(tn) + 0.2, text: tk ? `On 3rd down: blitzed ${tk} of ${tn}` : `On 3rd down: rushed 4 or fewer on all ${tn}` });
    if (rr.blitzA.n >= 3 && rr.fourA.n >= 4) {
      const d = rr.blitzA.sr - rr.fourA.sr;
      if (Math.abs(d) >= 0.2) out.push({ kind: 'blitz', n: rr.known, s: Math.abs(d) * Math.sqrt(rr.known) * 0.7, text: `Blitzing ${d > 0 ? 'is getting burned' : 'is working'}: ${pct(rr.blitzA.succ, rr.blitzA.n)}% offensive success vs ${pct(rr.fourA.succ, rr.fourA.n)}% with 4 or fewer` });
    }
    const sh = R.shell;
    if (sh.known >= 6) {
      const two = (sh.dist.find(g => g.key === '2') || { plays: [] }).plays.length;
      out.push({ kind: 'shell', n: sh.known, s: lean(two, sh.known) * Math.sqrt(sh.known) * 0.9 + 0.2, text: two >= sh.known / 2 ? `2-high shell on ${two} of ${sh.known} snaps` : `1-high (or 0) on ${sh.known - two} of ${sh.known} snaps` });
    }
    for (const b of sh.byBucket) {
      if (b.n >= 3 && (b.two / b.n >= 0.8 || b.two / b.n <= 0.2)) out.push({ kind: 'shell', n: b.n, s: strength(b.two, b.n) * 0.7, text: `On ${b.label}: ${b.two / b.n >= 0.8 ? '2-high' : 'single-high'} ${b.two / b.n >= 0.8 ? b.two : b.n - b.two} of ${b.n}` });
    }
    for (const b of sh.byPers) {
      if (b.n >= 3 && (b.two / b.n >= 0.8 || b.two / b.n <= 0.2)) out.push({ kind: 'shell', n: b.n, s: strength(b.two, b.n) * 0.75, text: `Vs ${b.label} personnel: ${b.two / b.n >= 0.8 ? '2-high' : 'single-high'} ${b.two / b.n >= 0.8 ? b.two : b.n - b.two} of ${b.n}` });
    }
    if (R.rotation.n >= 4 && R.rotation.k >= 2) out.push({ kind: 'disguise', n: R.rotation.n, s: (R.rotation.k / R.rotation.n) * Math.sqrt(R.rotation.n), text: `Rotated after the snap on ${R.rotation.k} of ${R.rotation.n} snaps where you read both shell and coverage` });
    const fam = R.cov.fam;
    if (R.cov.known >= 5) {
      const man = (fam.find(g => g.key === 'man') || { plays: [] }).plays.length;
      out.push({ kind: 'coverage', n: R.cov.known, s: lean(man, R.cov.known) * Math.sqrt(R.cov.known) * 0.8, text: man >= R.cov.known / 2 ? `Man coverage on ${man} of ${R.cov.known} reads` : `Zone coverage on ${R.cov.known - man} of ${R.cov.known} reads` });
    }
    if (R.motionRead.n >= 3) out.push({ kind: 'coverage', n: R.motionRead.n, s: lean(R.motionRead.man, R.motionRead.n) * Math.sqrt(R.motionRead.n) * 0.8, text: `Vs motion: a defender travelled on ${R.motionRead.man} of ${R.motionRead.n} (man tell)` });
    const heavy = R.box.runs.find(g => g.key === 'heavy'), light = R.box.runs.find(g => g.key === 'light');
    if (heavy && heavy.a.n >= 3) out.push({ kind: 'box', n: heavy.a.n, s: 0.6 + heavy.a.n * 0.1, text: `8+ in the box on ${heavy.a.n} runs: ${d1(heavy.a.ypp)} per carry allowed` });
    if (light && light.a.n >= 3) out.push({ kind: 'box', n: light.a.n, s: 0.55 + light.a.n * 0.1, text: `Light box (6 or fewer) on ${light.a.n} runs: ${d1(light.a.ypp)} per carry allowed` });
    if (R.pressure.known >= 6) out.push({ kind: 'pressure', n: R.pressure.known, s: lean(R.pressure.k, R.pressure.known) * Math.sqrt(R.pressure.known) * 0.6 + 0.2, text: `Pressure on ${R.pressure.k} of ${R.pressure.known} dropbacks, ${R.pressure.sacks} sack${R.pressure.sacks === 1 ? '' : 's'}` });
    for (const m of R.match) {
      if (m.n < 3) continue;
      const top = m.d.slice().sort((a, b) => b.n - a.n)[0];
      if (top && top.n / m.n >= 0.75) out.push({ kind: 'personnel', n: m.n, s: (top.n / m.n) * Math.sqrt(m.n) * 0.5, text: `Vs ${m.label} personnel: ${top.label.split(' (')[0].toLowerCase()} ${top.n} of ${m.n}` });
    }
    if (R.third.att >= 3) out.push({ kind: 'third', n: R.third.att, s: lean(R.third.stops, R.third.att) * Math.sqrt(R.third.att) * 0.6 + 0.2, text: `3rd downs: got off the field ${R.third.stops} of ${R.third.att}` });
    out.sort((a, b) => b.s - a.s);
    return dedupe(out);
  };

  function dedupe(list) {
    const seen = new Set();
    return list.filter(x => (seen.has(x.text) ? false : (seen.add(x.text), true)));
  }

  // ---------------------------------------------------------------- live tendency (scouting while you watch)
  // all: enriched plays from every game; feat: {pers, qb, set, down, dist}
  SR.tendency = function (all, offT, gid, feat) {
    const snaps = all.filter(p => p.offT === offT && SR.isSnap(p));
    const b = feat.down ? SR.bucket({ down: feat.down, dist: feat.dist }) : null;
    const levels = [];
    const has = k => feat[k] !== undefined && feat[k] !== null && feat[k] !== '';
    if (has('pers') && has('qb') && b) levels.push({ f: ['pers', 'qb', 'b'] });
    if (has('pers') && has('qb')) levels.push({ f: ['pers', 'qb'] });
    if (has('pers') && b) levels.push({ f: ['pers', 'b'] });
    if (has('pers')) levels.push({ f: ['pers'] });
    if (has('qb') && b) levels.push({ f: ['qb', 'b'] });
    if (has('qb')) levels.push({ f: ['qb'] });
    if (b) levels.push({ f: ['b'] });
    levels.push({ f: [] });
    const match = (p, f) => f.every(k => (k === 'b' ? SR.bucket(p) === b : p[k] === feat[k]));
    const count = l => ({ n: l.length, pass: l.filter(SR.isDropback).length, run: l.filter(SR.isRun).length });
    let chosen = null;
    for (const lv of levels) {
      const g = snaps.filter(p => p.gid === gid && match(p, lv.f));
      const s = snaps.filter(p => p.gid !== gid && match(p, lv.f));
      if (g.length >= 3 || (g.length + s.length >= 5)) { chosen = { f: lv.f, game: count(g), season: count(s) }; break; }
      if (!chosen && (g.length || s.length)) chosen = { f: lv.f, game: count(g), season: count(s), thin: true };
    }
    if (!chosen) return null;
    chosen.label = chosen.f.length ? chosen.f.map(k => k === 'b' ? (SR.BUCKETS.find(x => x[0] === b) || [b, b])[1] : k === 'pers' ? feat.pers + ' personnel' : SR.label(k, feat[k]).toLowerCase()).join(', ') : 'all snaps';
    chosen.all = !chosen.f.length;
    return chosen;
  };

  // Defensive habit in the current down & distance (for Coach's eye)
  SR.defHabit = function (all, defT, gid, down, dist) {
    const b = SR.bucket({ down, dist });
    const l = all.filter(p => p.defT === defT && p.gid === gid && SR.isSnap(p) && SR.bucket(p) === b);
    const rk = l.filter(p => p.rush);
    const sk = l.filter(p => p.shell);
    return {
      bucket: (SR.BUCKETS.find(x => x[0] === b) || [b, b])[1],
      rush: { n: rk.length, blitz: rk.filter(p => +p.rush >= 5).length },
      shell: { n: sk.length, two: sk.filter(p => p.shell === '2').length }
    };
  };

  // ---------------------------------------------------------------- predictions ("your call")
  SR.predictions = function (plays) {
    const l = plays.filter(p => p.pred && SR.isSnap(p));
    const hit = p => (p.pred === 'pass') === SR.isDropback(p);
    const hits = l.filter(hit);
    const misses = l.filter(p => !hit(p));
    const missBy = (f, opt) => groupBy(misses.filter(p => p[f]), p => p[f], opt).map(g => ({ label: g.label, n: g.plays.length, expected: g.plays.filter(p => p.pred === 'run').length }));
    return {
      n: l.length, hits: hits.length,
      runCalls: l.filter(p => p.pred === 'run').length,
      passCalls: l.filter(p => p.pred === 'pass').length,
      missRunWasPass: misses.filter(p => p.pred === 'run').length,
      missPassWasRun: misses.filter(p => p.pred === 'pass').length,
      missByPers: missBy('pers', SR.OPT.pers),
      missByQb: missBy('qb', SR.OPT.qb),
      byHalf: [1, 2].map(h => { const x = l.filter(p => p.half === h); return { n: x.length, hits: x.filter(hit).length }; })
    };
  };

  // ---------------------------------------------------------------- half comparison (adjustments)
  SR.compareHalves = function (plays, lens) {
    const h1 = plays.filter(p => p.half === 1), h2 = plays.filter(p => p.half === 2);
    const rows = [];
    const add = (label, f1, f2, kind) => { if (f1 && f2) rows.push(Object.assign({ label, kind }, compareRate(f1, f2))); };
    if (lens === 'off') {
      const a = SR.offense(h1), b = SR.offense(h2);
      add('Pass rate', [a.all.db, a.all.n], [b.all.db, b.all.n]);
      add('Early-down pass rate', [a.early.db, a.early.n], [b.early.db, b.early.n]);
      add('Success rate', [a.all.succ, a.all.n], [b.all.succ, b.all.n], 'good');
      add('Motion rate', [a.motion.yes, a.motion.known], [b.motion.yes, b.motion.known]);
      add('Play-action share', [a.pass.paAgg.n, a.pass.att], [b.pass.paAgg.n, b.pass.att]);
      add('Shotgun share', [((a.byQb.find(g => g.key === 'gun') || { a: { n: 0 } }).a.n), a.byQb.reduce((s, g) => s + g.a.n, 0)], [((b.byQb.find(g => g.key === 'gun') || { a: { n: 0 } }).a.n), b.byQb.reduce((s, g) => s + g.a.n, 0)]);
      const persKeys = new Set([...a.byPers.map(g => g.key), ...b.byPers.map(g => g.key)]);
      const tA = a.byPers.reduce((s, g) => s + g.a.n, 0), tB = b.byPers.reduce((s, g) => s + g.a.n, 0);
      for (const k of persKeys) {
        const x = (a.byPers.find(g => g.key === k) || { a: { n: 0 } }).a.n, y = (b.byPers.find(g => g.key === k) || { a: { n: 0 } }).a.n;
        add(`${SR.label('pers', k)} personnel share`, [x, tA], [y, tB]);
      }
    } else {
      const a = SR.defense(h1), b = SR.defense(h2);
      add('Blitz rate', [a.rush.blitz, a.rush.known], [b.rush.blitz, b.rush.known]);
      const two = R => (R.shell.dist.find(g => g.key === '2') || { plays: [] }).plays.length;
      add('2-high shell rate', [two(a), a.shell.known], [two(b), b.shell.known]);
      const man = R => (R.cov.fam.find(g => g.key === 'man') || { plays: [] }).plays.length;
      add('Man coverage rate', [man(a), a.cov.known], [man(b), b.cov.known]);
      add('Pressure rate', [a.pressure.k, a.pressure.known], [b.pressure.k, b.pressure.known], 'good');
      add('Success allowed', [a.all.succ, a.all.n], [b.all.succ, b.all.n], 'bad');
      const heavy = R => R.box.dist.filter(g => +g.key >= 8).reduce((s, g) => s + g.plays.length, 0);
      add('8+ man box rate', [heavy(a), a.box.known], [heavy(b), b.box.known]);
    }
    return rows;
  };
  function compareRate(f1, f2) {
    const [k1, n1] = f1, [k2, n2] = f2;
    const r1v = n1 ? k1 / n1 : null, r2v = n2 ? k2 / n2 : null;
    const delta = r1v != null && r2v != null ? r2v - r1v : null;
    const big = delta != null && n1 >= 6 && n2 >= 6 && Math.abs(delta) >= 0.15;
    return { k1, n1, k2, n2, r1: r1v, r2: r2v, delta, big };
  }

  // ---------------------------------------------------------------- watch-list for the 2nd half
  SR.watchList = function (ctx) {
    // ctx: {my, opp, offMy, defMy, offOpp, defOpp, insights:{...}, pred, known}
    const w = [];
    const add = (s, text) => w.push({ s, text });
    const units = [
      ['my', ctx.my, ctx.offMy, ctx.defMy, ctx.opp],
      ['opp', ctx.opp, ctx.offOpp, ctx.defOpp, ctx.my]
    ];
    for (const [, T, O, D, Opp] of units) {
      if (!O || !D) continue;
      // strongest personnel/formation tell
      const tells = SR.offenseInsights(O, T).filter(i => i.kind === 'tell');
      if (tells[0]) { const x = tells[0]; add(x.s + 0.5, `${T} ${x.pass ? 'threw' : 'ran'} on ${x.k} of ${x.n} snaps ${x.ctx}. Does ${Opp} start selling out for it, and does ${T} break the habit?`); }
      if (O.n >= 10 && O.all.sr < 0.35) add(1.4, `${T}'s offense is stalling (${pct(O.all.succ, O.n)}% success). Watch for changes: more motion, play-action, different personnel or tempo.`);
      if (O.run.a.n >= 6 && O.run.a.sr >= 0.55) add(1.2, `${T}'s runs are working (${O.run.a.succ} of ${O.run.a.n} successful). Does ${Opp} bring an 8th defender into the box and play single-high?`);
      if (D.rush.known >= 8 && D.rush.rate >= 0.4) add(1.1, `${T} is blitzing a lot (${D.rush.blitz} of ${D.rush.known}). Watch ${Opp}'s protection: backs and tight ends staying in, quicker throws, screens.`);
      const two = (D.shell.dist.find(g => g.key === '2') || { plays: [] }).plays.length;
      if (D.shell.known >= 8 && two / D.shell.known >= 0.7) add(1.0, `${T}'s defense lives in 2-high (${two} of ${D.shell.known}). Lighter boxes invite ${Opp} to run. Watch whether they lean into it.`);
      if (D.shell.known >= 8 && two / D.shell.known <= 0.3) add(1.0, `${T}'s defense plays single-high (${D.shell.known - two} of ${D.shell.known}). Expect ${Opp} to attack with crossers and play-action over the middle.`);
    }
    if (ctx.weakRead) add(0.9, `Your reads: you logged the ${ctx.weakRead.name} on only ${ctx.weakRead.k} of ${ctx.weakRead.n} snaps. Make it your focus for the next two drives.`);
    w.sort((a, b) => b.s - a.s);
    return w.slice(0, 5).map(x => x.text);
  };

  // ---------------------------------------------------------------- situation hints (general football knowledge)
  SR.situationHint = function (sit, scoreFor, scoreAgainst) {
    const { down, dist, spot, q } = sit;
    const goal = spot + dist >= 100;
    const tips = [];
    if (spot >= 95 || (goal && dist <= 3)) tips.push(['Goal line', 'Tight space: heavy personnel and crowded boxes. Watch for QB sneaks, play-action to tight ends, and man coverage with no deep help.']);
    else if (spot >= 80) tips.push(['Red zone', 'The field shrinks: less room for deep zones, more man coverage and tighter windows. Fades, slants and pick concepts show up here.']);
    else if (spot <= 10) tips.push(['Backed up', 'Offenses usually play safe here — runs and quick throws, often under center. A safety is in play.']);
    if (down === 1) tips.push(['1st down', 'The most balanced down. Personnel and formation are your best clues for run vs pass.']);
    else if (down === 2 && dist >= 7) tips.push(['2nd & long', 'Behind schedule. Expect a pass, or a run aiming to get back to 3rd & manageable — screens and draws live here.']);
    else if (down === 2 && dist <= 3) tips.push(['2nd & short', 'A “free play” down: offenses often take a shot downfield, usually off play-action.']);
    else if (down === 3 && dist >= 7) tips.push(['3rd & long', 'Very likely a pass. Watch whether routes break past the sticks, and whether the defense drops 7 or brings pressure.']);
    else if (down === 3 && dist <= 2) tips.push(['3rd & short', 'Run or quick pass. Count the box, and watch for a QB sneak or a quick slant.']);
    else if (down === 3) tips.push(['3rd & medium', 'The true guessing down: quick-game timing routes vs pressure. Count rushers after the snap.']);
    else if (down === 4) tips.push(['4th down', 'Going for it tells you something about the coach. Score, time and field position drive the call.']);
    const diff = (scoreFor ?? 0) - (scoreAgainst ?? 0);
    if (q >= 4 && diff >= 9) tips.push(['Protecting a lead', 'Leading late: expect runs, a running clock, and the defense playing deep to prevent big plays.']);
    else if (q >= 4 && diff <= -9) tips.push(['Chasing points', 'Trailing late: pass-heavy, sideline throws to stop the clock, soft zone from the defense.']);
    return tips.slice(0, 2);
  };

  // ---------------------------------------------------------------- focus training
  SR.FOCI = [
    { id: 'pers', name: 'Personnel & formation', fields: ['pers', 'qb', 'set'], learn: 'personnel',
      cue: 'As they break the huddle, count running backs and tight ends — skip the receivers. Then note where the QB stands and how many receivers are on each side.' },
    { id: 'safeties', name: 'Safeties', fields: ['shell', 'cov', 'covf'], learn: 'shells',
      cue: 'As the QB gets set, find the safeties at the top of the shot. Two deep and wide = 2-high; one deep in the middle = 1-high. Then watch where they go at the snap.' },
    { id: 'ol', name: 'Run blocking', fields: ['rc', 'lane'], learn: 'runs',
      cue: 'At the snap, watch the guards, not the ball. A guard pulling = gap scheme (two pullers = counter). The whole line stepping the same way = zone.' },
    { id: 'rush', name: 'Pass rush', fields: ['rush', 'rushx', 'pres'], learn: 'pressure',
      cue: 'At the snap, count who crosses the line. 5 or more = blitz. If a linebacker rushes but a lineman drops out, that’s sim pressure.' },
    { id: 'motion', name: 'Motion', fields: ['motion', 'mread'], learn: 'motion',
      cue: 'When a receiver moves, look at the defender across from him. Running with him = likely man. Defenders sliding over or safeties shifting = likely zone.' },
    { id: 'box', name: 'Box & front', fields: ['box', 'dpers'], learn: 'box',
      cue: 'Count defenders tight to the ball, between the tight ends, within about 5–7 yards. 8 or more = they’re loading up for the run.' },
    { id: 'cov', name: 'Coverage', fields: ['covf', 'cov'], learn: 'coverage',
      cue: 'On the replay, pick one corner. Turns and runs with his receiver = man. Eyes on the QB, sinking to an area = zone.' },
    { id: 'pass', name: 'Pass game', fields: ['pt', 'pres'], learn: 'passing',
      cue: 'Watch the QB’s first two steps: a quick catch-and-throw, a deeper drop, or a run fake first. Then note where the ball lands.' }
  ];
  SR.FOCUS_PLAN = { 1: 'pers', 2: 'safeties', 3: 'ol', 4: 'rush', 5: 'rush' };
  SR.focusFor = function (game) {
    const id = !game.focus || game.focus === 'auto' ? SR.FOCUS_PLAN[game.sit.q] || 'pers' : game.focus;
    return SR.FOCI.find(f => f.id === id) || SR.FOCI[0];
  };

  // ---------------------------------------------------------------- export helpers
  SR.toCSV = function (games) {
    const cols = ['week', 'date', 'offense', 'defense', 'quarter', 'drive', 'down', 'distance', 'yardline', 'type', 'yards', 'success', 'first_down', 'td', 'turnover',
      'personnel', 'qb', 'set', 'motion', 'motion_read', 'def_personnel', 'box', 'shell', 'run_concept', 'run_lane', 'pass_type', 'pass_result', 'depth', 'direction',
      'pressure', 'rushers', 'rush_extra', 'coverage_family', 'coverage', 'penalty', 'tags', 'your_call', 'note'];
    const rows = [cols.join(',')];
    for (const g of games) {
      for (const p of SR.enrich(g)) {
        const o = p.o;
        const v = [g.week, g.date, p.offT, p.defT, p.q, p.drive, p.down, p.dist, SR.spotText(g, p.off, p.spot), p.type, SR.isSnap(p) ? o.gain : '',
          SR.isSnap(p) ? (SR.success(p) ? 1 : 0) : '', o.fd ? 1 : 0, o.td ? 1 : 0, o.turnover || '',
          p.pers, p.qb, p.set, p.motion, p.mread, p.dpers, p.box, p.shell, p.rc, p.lane, p.pt, p.pr, p.depth, p.dir,
          p.pres, p.rush, (p.rushx || []).join('|'), p.cov ? SR.COV_FAMILY[p.cov] : p.covf, p.cov,
          p.pen ? `${p.pen.on} ${p.pen.yds}${p.pen.noPlay ? ' no play' : ''}` : '', (p.tags || []).join('|'), p.pred, p.note];
        rows.push(v.map(csvCell).join(','));
      }
    }
    return rows.join('\n');
  };
  function csvCell(v) {
    if (v === undefined || v === null) return '';
    const s = String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Snap Read — Learn: recognition guides and X's-and-O's diagrams. */
(function (global) {
  'use strict';
  const SR = global.SR = global.SR || {};

  // ------------------------------------------------------------ diagram renderer
  // Coordinates in yards: x from left sideline (0..53.3), y relative to the line
  // of scrimmage (positive = downfield / defense side, negative = backfield).
  const W = 53.3, S = 10, C = 26.65;

  function arrowHead(x1, y1, x2, y2, size) {
    const a = Math.atan2(y2 - y1, x2 - x1);
    const s = size || 9;
    const p1 = [x2 - s * Math.cos(a - 0.45), y2 - s * Math.sin(a - 0.45)];
    const p2 = [x2 - s * Math.cos(a + 0.45), y2 - s * Math.sin(a + 0.45)];
    return `${x2},${y2} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }

  function drawDiagram(d) {
    const y0 = d.y0 != null ? d.y0 : -8, y1 = d.y1 != null ? d.y1 : 20;
    const x0 = d.x0 != null ? d.x0 : 0, x1 = d.x1 != null ? d.x1 : W;
    const vw = (x1 - x0) * S, vh = (y1 - y0) * S;
    const X = x => ((x - x0) * S).toFixed(1), Y = y => ((y1 - y) * S).toFixed(1);
    const nx = x => (x - x0) * S, ny = y => (y1 - y) * S;
    let s = `<svg class="dg" viewBox="0 0 ${vw.toFixed(0)} ${vh.toFixed(0)}" role="img" aria-label="${d.alt || ''}">`;
    s += `<rect class="dg-field" x="0" y="0" width="${vw}" height="${vh}"/>`;
    for (let y = Math.ceil(y0 / 5) * 5; y <= y1; y += 5) {
      if (y === 0) continue;
      s += `<line class="dg-yard" x1="0" x2="${vw}" y1="${Y(y)}" y2="${Y(y)}"/>`;
    }
    // hashes
    for (let y = Math.ceil(y0); y <= y1; y++) {
      for (const hx of [23.6, 29.7]) {
        if (hx < x0 || hx > x1) continue;
        s += `<line class="dg-hash" x1="${X(hx - 0.4)}" x2="${X(hx + 0.4)}" y1="${Y(y)}" y2="${Y(y)}"/>`;
      }
    }
    s += `<line class="dg-los" x1="0" x2="${vw}" y1="${Y(0)}" y2="${Y(0)}"/>`;
    if (d.box) {
      const b = d.box;
      s += `<rect class="dg-boxrect" x="${X(b[0])}" y="${Y(b[3])}" width="${((b[2] - b[0]) * S).toFixed(1)}" height="${((b[3] - b[1]) * S).toFixed(1)}" rx="10"/>`;
    }
    for (const z of d.zones || []) {
      const cls = 'dg-zone ' + (z.k || 'under');
      if (z.e) {
        s += `<ellipse class="${cls}" cx="${X(z.x)}" cy="${Y(z.y)}" rx="${(z.rx * S).toFixed(1)}" ry="${(z.ry * S).toFixed(1)}"/>`;
      } else {
        s += `<rect class="${cls}" x="${X(z.x)}" y="${Y(z.y + z.h)}" width="${(z.w * S).toFixed(1)}" height="${(z.h * S).toFixed(1)}" rx="8"/>`;
      }
      if (z.t) {
        const cx = z.e ? z.x : z.x + z.w / 2, cy = z.e ? z.y : (z.k === 'deep' ? z.y + z.h / 2 : z.y + z.h - 1.3);
        s += `<text class="dg-zlabel" x="${X(cx)}" y="${Y(cy)}" dy="0.35em" text-anchor="middle">${z.t}</text>`;
      }
    }
    for (const p of d.paths || []) {
      const pts = p.d.map(q => [nx(q[0]), ny(q[1])]);
      const cls = 'dg-path ' + (p.k || 'route');
      let dAttr;
      if (p.curve && pts.length === 3) {
        dAttr = `M${pts[0][0]},${pts[0][1]} Q${pts[1][0]},${pts[1][1]} ${pts[2][0]},${pts[2][1]}`;
      } else {
        dAttr = 'M' + pts.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' L');
      }
      s += `<path class="${cls}" d="${dAttr}"/>`;
      const n = pts.length;
      const a = p.curve && n === 3 ? pts[1] : pts[n - 2], b = pts[n - 1];
      if (p.k === 'block') {
        const ang = Math.atan2(b[1] - a[1], b[0] - a[0]) + Math.PI / 2;
        const L = 7;
        s += `<line class="${cls}" x1="${(b[0] - L * Math.cos(ang)).toFixed(1)}" y1="${(b[1] - L * Math.sin(ang)).toFixed(1)}" x2="${(b[0] + L * Math.cos(ang)).toFixed(1)}" y2="${(b[1] + L * Math.sin(ang)).toFixed(1)}"/>`;
      } else if (p.k !== 'man') {
        s += `<polygon class="dg-head ${p.k || 'route'}" points="${arrowHead(a[0], a[1], b[0], b[1])}"/>`;
      }
    }
    for (const o of d.off || []) {
      const [x, y, l, sq] = o;
      if (sq) s += `<rect class="dg-off" x="${(nx(x) - 6.5).toFixed(1)}" y="${(ny(y) - 6.5).toFixed(1)}" width="13" height="13" rx="2.5"/>`;
      else s += `<circle class="dg-off${l === 'QB' ? ' qb' : ''}" cx="${X(x)}" cy="${Y(y)}" r="${l ? 8.5 : 6.5}"/>`;
      if (l) s += `<text class="dg-olabel${l === 'QB' ? ' qb' : ''}" x="${X(x)}" y="${Y(y)}" dy="0.36em" text-anchor="middle">${l}</text>`;
    }
    for (const o of d.def || []) {
      const [x, y, l, hl] = o;
      s += `<text class="dg-def${hl ? ' hl' : ''}" x="${X(x)}" y="${Y(y)}" dy="0.36em" text-anchor="middle">${l}</text>`;
    }
    for (const t of d.notes || []) {
      s += `<text class="dg-note" x="${X(t[0])}" y="${Y(t[1])}" text-anchor="${t[3] || 'middle'}">${t[2]}</text>`;
    }
    s += '</svg>';
    return s;
  }
  SR.drawDiagram = drawDiagram;

  // ------------------------------------------------------------ building blocks
  const OL = () => [[C - 3, -0.9, '', false], [C - 1.5, -0.9, '', false], [C, -0.9, '', true], [C + 1.5, -0.9, '', false], [C + 3, -0.9, '', false]];
  // 11 personnel, 2x2, shotgun, TE attached right
  const off11 = () => OL().concat([[5, -0.9, 'X'], [14, -1.6, 'H'], [C + 4.6, -0.9, 'Y'], [48.3, -1.6, 'Z'], [C, -5, 'QB'], [C + 1.9, -5.2, 'R']]);
  const front4 = () => [[C - 4.4, 0.9, 'D'], [C - 0.8, 0.9, 'D'], [C + 1.7, 0.9, 'D'], [C + 5.6, 0.9, 'D']];
  const rushArrows = (pts) => pts.map(p => ({ k: 'rush', d: [[p[0], 1.6], [p[1], -2.6]] }));
  const R4 = () => rushArrows([[C - 4.4, C - 3.6], [C - 0.8, C - 0.7], [C + 1.7, C + 1.2], [C + 5.6, C + 4.2]]);

  const DG = {};

  DG.pers11 = { alt: '11 personnel in a 2 by 2 shotgun set', y0: -8, y1: 3, off: off11(),
    notes: [[C, 2, '1 back (R) · 1 tight end (Y) · 3 receivers']] };
  DG.trips = { alt: '3 by 1 trips formation', y0: -8, y1: 3,
    off: OL().concat([[5, -0.9, 'X'], [C + 4.6, -0.9, 'Y'], [38, -1.6, 'H'], [48.3, -0.9, 'Z'], [C, -5, 'QB'], [C - 1.9, -5.2, 'R']]),

      table: [['On schedule', 'Gains that keep 3rd down short', '1st & 10 → 2nd & 6 or better.'], ['Behind the sticks', 'Long yardage after a loss or incompletion', 'Limits the playbook, invites pressure.'], ['Money down', '3rd down', 'Where coordinators show their best calls.'], ['Red zone', 'Inside the opponent’s 20', 'Compressed field, more man coverage.'], ['Four-minute', 'Leading late, burning clock', 'Runs, under center, clock running.'], ['Two-minute', 'Hurry-up before the half or end of game', 'Sideline throws, spikes, soft zones.']],
      tells: [

      tells: [

      ],
      source: ['Success-rate definition: Sharp Football Analysis', 'https://www.sharpfootballanalysis.com/nfl-stats/offense/efficiency/run-pass-success-rate-2016/']
    }

  SR.FIELD_TOPIC = { pers: 'personnel', qb: 'formations', set: 'formations', motion: 'motion', mread: 'motion', rc: 'runs', lane: 'runs', pt: 'passing', pr: 'passing', depth: 'passing', pres: 'passing', box: 'box', dpers: 'box', shell: 'shells', cov: 'coverage', covf: 'coverage', rush: 'pressure', rushx: 'pressure', pred: 'routine' };
